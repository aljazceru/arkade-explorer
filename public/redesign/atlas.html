/* Merged tx map: flow graph on top (inputs → tx node → outputs → spent stubs),
   then the ancestry spine continues down to the on-chain anchor — one coordinate system.
   Desktop: left→right flow. Mobile (narrow): inputs above, outputs below. */
function buildTxMap(t, chain){
  const svg=$('#txSvg'); if(!svg)return;
  svg.innerHTML='';
  const inputs=t.inputs||[], outputs=t.outputs||[];
  const vertical = window.innerWidth<720;
  const W = vertical?460:1000;
  const cx=W/2;
  // spine entries: skip entries[0] when it is this tx itself (flow already shows it)
  let entries=[];
  if(chain&&chain.entries) entries=chain.entries.filter((e,i)=>!(i===0&&e.txid===t.txid));
  const hasSpine=entries.length>0;
  const rowH=30;
  // ---------- flow metrics ----------
  let flowH, ty, inX, outX;
  if(!vertical){
    const lanes=Math.max(inputs.length,outputs.length,1);
    flowH=Math.max(230,64+lanes*56+36);
    ty=flowH/2-8; inX=W*0.205; outX=W*0.795;
  }else{
    // centered column: inputs above tx, outputs below (metro style)
    const inPitch=46,outPitch=66;
    ty=50+inputs.length*inPitch+40;
    flowH=ty+80+Math.max(0,outputs.length-1)*outPitch+56;
  }
  const spineY0=flowH+18;
  const H=spineY0+(hasSpine?entries.length*rowH+80:60)+20;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('height',H);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  // arrow marker for spent stubs
  const defs=svgEl('defs',{},svg);
  const mk=(id,col)=>{const m=svgEl('marker',{id,viewBox:'0 0 8 8',refX:7,refY:4,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'},defs);svgEl('path',{d:'M0 0 L8 4 L0 8 Z',fill:col},m);};
  mk('arrV','#8FB8FF'); mk('arrG','#F2A93B');
  // amount-scaled node radius
  const allAmt=[...inputs.map(i=>i.amount||i.vtxo?.amount||0),...outputs.map(o=>o.amount||0),t.totalIn||0];
  const maxAmt=Math.max(1,...allAmt);
  const nodeR=a=>Math.max(8,Math.min(24,8+16*Math.sqrt((a||0)/maxAmt)));
  const lifeRing=(g,r,frac,alert)=>{
    if(frac==null)return;
    const circ=2*Math.PI*(r+2.5);
    svgEl('circle',{r:r+2.5,fill:'none',stroke:'#1E2532','stroke-width':2},g);
    svgEl('circle',{r:r+2.5,fill:'none',stroke:alert?'#FF6464':frac<0.25?'#FF6464':'#5ED6AE','stroke-width':2,'stroke-linecap':'round','stroke-dasharray':`${circ*Math.max(.03,frac)} ${circ}`,'transform':'rotate(-90)'},g);
  };
  const spentStub=(sx,sy,spentBy)=>{
    const stubX=Math.min(W-50,sx+58);
    line(svg,sx,sy,stubX-13,sy,{stroke:'#5E6879',w:1,dash:'2 3','marker-end':'url(#arrV)'});
    const sg=svgEl('g',{transform:`translate(${stubX} ${sy})`,style:'cursor:pointer'},svg);
    svgEl('rect',{x:-11,y:-11,width:22,height:22,rx:5,fill:'#10182B',stroke:'#5E6879','stroke-width':1.1,'stroke-dasharray':'3 2'},sg);
    txt(sg,0,3,'→',{fs:9,fill:'#9AA4B5',anchor:'middle'});
    txt(sg,0,26,mid(spentBy,6),{fs:7,fill:'#5E6879',anchor:'middle'});
    bindTip(sg,`<div class="tt">spent by${VTX[spentBy]?'':' (not in snapshot)'}</div><div class="tx">${spentBy}</div>`,e=>[e.clientX,e.clientY]);
    sg.addEventListener('click',e=>{e.stopPropagation();location.hash='#/tx/'+spentBy;});
  };
  // ---------- tx node ----------
  const txG=svgEl('g',{transform:`translate(${cx} ${ty})`},svg);
  svgEl('rect',{x:-58,y:-37,width:116,height:74,rx:14,fill:'#10182B',stroke:'#8FB8FF','stroke-width':1.6},txG);
  txt(txG,0,-16,t.kind,{fs:12,fill:'#E6EAF2',anchor:'middle',weight:600});
  txt(txG,0,-2,'ark tx',{fs:8.5,fill:'#8FB8FF',anchor:'middle'});
  txt(txG,0,13,t.state,{fs:9,fill:'#9AA4B5',anchor:'middle'});
  txt(txG,0,26,mid(t.txid,9),{fs:7.5,fill:'#5E6879',anchor:'middle'});
  bindTip(txG,`<div class="tt">this transaction</div><div class="tx">${t.txid}</div><div style="margin-top:4px">${sats(t.totalIn)} in · ${sats(t.totalOut)} out</div>`,e=>[e.clientX,e.clientY]);
  // connector tx → spine
  if(hasSpine) line(svg,cx,ty+38,cx,spineY0-8,{stroke:'#2A3344',w:1.4});
  // ---------- inputs / outputs ----------
  if(!vertical){
    // per-lane vertical pitch: ~64px nominal, only shrinks if the flow band is tight
    const pitch=n=>n>1?Math.min(64,(flowH-110)/Math.max(1,n-1)):0;
    inputs.forEach((inp,i)=>{
      const iy=ty+(i-(inputs.length-1)/2)*pitch(inputs.length);
      const amt=inp.amount||inp.vtxo?.amount||0, r=nodeR(amt);
      const frac=inp.vtxo&&inp.vtxo.expiresAt&&inp.vtxo.createdAt?Math.max(0,Math.min(1,(inp.vtxo.expiresAt-now())/(inp.vtxo.expiresAt-inp.vtxo.createdAt))):null;
      const g=svgEl('g',{transform:`translate(${inX} ${iy})`,style:'cursor:pointer'},svg);
      lifeRing(g,r,frac,false);
      svgEl('circle',{r,fill:'#10182B',stroke:'#8FB8FF','stroke-width':1.3},g);
      txt(g,0,r+13,satsMini(amt),{fs:8.5,fill:'#9AA4B5',anchor:'middle'});
      if(inp.via==='checkpoint'||inp.checkpointTxid){svgEl('circle',{cx:r+11,cy:-r-7,r:5.5,fill:'none',stroke:'#6C7BD9','stroke-width':1.4},g);txt(g,r+11,-r+3,'cp',{fs:7,fill:'#6C7BD9',anchor:'middle'});}
      const portY=ty+Math.max(-30,Math.min(30,(i-(inputs.length-1)/2)*22));
      curve(svg,inX+r+12,iy,cx-96,iy,cx-64,portY,cx-58,portY,{stroke:'#8FB8FF',w:1.3});
      const label=inp.via==='batch'?'batch output':inp.via==='checkpoint'?'via checkpoint':'vtxo';
      bindTip(g,`<div class="tt">input · ${esc(label)}</div><div class="tx">${mid(inp.outpoint||inp.txid||'',18)}</div><div style="margin-top:4px">${sats(amt)}${inp.vtxo?' · '+esc(inp.vtxo.state):''}</div>`,e=>[e.clientX,e.clientY]);
      g.addEventListener('click',()=>{const op=inp.vtxo?.outpoint||inp.outpoint; if(op)location.hash='#/tx/'+op.split(':')[0];});
    });
    outputs.forEach((out,i)=>{
      const oy=ty+(i-(outputs.length-1)/2)*pitch(outputs.length);
      const portY=ty+Math.max(-30,Math.min(30,(i-(outputs.length-1)/2)*22));
      if(out.kind==='anchor'){
        const g=svgEl('g',{transform:`translate(${outX} ${oy})`},svg);
        svgEl('rect',{x:-7,y:-7,width:14,height:14,fill:'none',stroke:'#5E6879','stroke-width':1.2,'stroke-dasharray':'2 2'},g);
        txt(g,0,22,'anchor',{fs:8,fill:'#5E6879',anchor:'middle'});
        curve(svg,cx+58,portY,outX-30,oy,outX-14,oy,outX-8,oy,{stroke:'#3A4557',w:1.1,dash:'2 3'});
        bindTip(g,`<div class="tt">anchor output</div>commitment root — not a spendable VTXO`,e=>[e.clientX,e.clientY]);
        return;
      }
      const amt=out.amount||0, r=nodeR(amt);
      const vv=out.vtxo;
      const frac=vv&&vv.expiresAt&&vv.createdAt?Math.max(0,Math.min(1,(vv.expiresAt-now())/(vv.expiresAt-vv.createdAt))):null;
      const alert=vv&&(vv.state==='renew'||vv.state==='expired');
      const g=svgEl('g',{transform:`translate(${outX} ${oy})`,style:'cursor:pointer'},svg);
      lifeRing(g,r,frac,alert);
      svgEl('circle',{r,fill:alert?'#2A1216':'#10182B',stroke:alert?'#FF6464':'#E6EAF2','stroke-width':1.4},g);
      txt(g,0,r+13,satsMini(amt),{fs:8.5,fill:'#9AA4B5',anchor:'middle'});
      curve(svg,cx+58,portY,outX-r-18,oy,outX-r-8,oy,outX-r-3,oy,{stroke:'#8FB8FF',w:1.3});
      bindTip(g,`<div class="tt">output vout ${out.vout} · vtxo</div><div class="tx">${mid(vv?vv.outpoint:'',18)}</div><div style="margin-top:4px">${sats(amt)} · ${vv?esc(vv.state):''} · expires ${vv?until(vv.expiresAt):'—'}</div>`,e=>[e.clientX,e.clientY]);
      g.addEventListener('click',()=>location.hash='#/vtxo/'+encodeURIComponent(vv?vv.outpoint:t.txid+':'+out.vout));
      if(vv&&vv.spentByTx) spentStub(outX+r+4,oy,vv.spentByTx);
    });
    txt(svg,20,flowH-10,`in ${satsMini(t.totalIn)} · out ${satsMini(t.totalOut)} · ${inputs.length} in · ${outputs.length} out`,{fs:9.5,fill:'#5E6879'});
    if(hasSpine) line(svg,24,spineY0-15,W-24,spineY0-15,{stroke:'#1E2532',w:1});
  }else{
    // ---------- vertical flow: centered metro column ----------
    const inPitch=46,outPitch=66;
    inputs.forEach((inp,i)=>{
      const iy=54+i*inPitch;
      const amt=inp.amount||inp.vtxo?.amount||0, r=Math.min(nodeR(amt),18);
      const frac=inp.vtxo&&inp.vtxo.expiresAt&&inp.vtxo.createdAt?Math.max(0,Math.min(1,(inp.vtxo.expiresAt-now())/(inp.vtxo.expiresAt-inp.vtxo.createdAt))):null;
      const g=svgEl('g',{transform:`translate(${cx} ${iy})`,style:'cursor:pointer'},svg);
      lifeRing(g,r,frac,false);
      svgEl('circle',{r,fill:'#10182B',stroke:'#8FB8FF','stroke-width':1.3},g);
      const lab=(inp.via==='batch'?'batch':inp.via==='checkpoint'?'checkpoint':'vtxo')+' · '+satsMini(amt);
      txt(g,r+11,4,lab,{fs:10,fill:'#9AA4B5'});
      const portX=cx+Math.max(-26,Math.min(26,(i-(inputs.length-1)/2)*24));
      curve(svg,cx,iy+r+4,portX-14,iy+r+30,portX,ty-52,portX,ty-37,{stroke:'#8FB8FF',w:1.3});
      bindTip(g,`<div class="tt">input · ${esc(inp.via||'vtxo')}</div><div class="tx">${mid(inp.outpoint||inp.txid||'',18)}</div><div style="margin-top:4px">${sats(amt)}${inp.vtxo?' · '+esc(inp.vtxo.state):''}</div>`,e=>[e.clientX,e.clientY]);
      g.addEventListener('click',()=>{const op=inp.vtxo?.outpoint||inp.outpoint; if(op)location.hash='#/tx/'+op.split(':')[0];});
    });
    if(inputs.length) txt(svg,20,26,'inputs',{fs:9.5,fill:'#5E6879'});
    outputs.forEach((out,j)=>{
      const oy=ty+80+j*outPitch;
      const portX=cx+Math.max(-26,Math.min(26,(j-(outputs.length-1)/2)*24));
      if(out.kind==='anchor'){
        const g=svgEl('g',{transform:`translate(${cx} ${oy})`},svg);
        svgEl('rect',{x:-7,y:-7,width:14,height:14,fill:'none',stroke:'#5E6879','stroke-width':1.2,'stroke-dasharray':'2 2'},g);
        txt(g,0,24,'anchor',{fs:8.5,fill:'#5E6879',anchor:'middle'});
        curve(svg,portX,ty+37,portX,ty+56,cx-8,oy-20,cx-6,oy-8,{stroke:'#3A4557',w:1.1,dash:'2 3'});
        bindTip(g,`<div class="tt">anchor output</div>commitment root — not a spendable VTXO`,e=>[e.clientX,e.clientY]);
        return;
      }
      const amt=out.amount||0, r=Math.min(nodeR(amt),18);
      const vv=out.vtxo;
      const frac=vv&&vv.expiresAt&&vv.createdAt?Math.max(0,Math.min(1,(vv.expiresAt-now())/(vv.expiresAt-vv.createdAt))):null;
      const alert=vv&&(vv.state==='renew'||vv.state==='expired');
      const g=svgEl('g',{transform:`translate(${cx} ${oy})`,style:'cursor:pointer'},svg);
      lifeRing(g,r,frac,alert);
      svgEl('circle',{r,fill:alert?'#2A1216':'#10182B',stroke:alert?'#FF6464':'#E6EAF2','stroke-width':1.4},g);
      txt(g,0,r+16,satsMini(amt)+' sats',{fs:10,fill:'#9AA4B5',anchor:'middle'});
      curve(svg,portX,ty+37,cx+(portX>cx?14:-14),ty+62,cx,oy-r-8,cx,oy-r-3,{stroke:'#8FB8FF',w:1.3});
      bindTip(g,`<div class="tt">output vout ${out.vout} · vtxo</div><div class="tx">${mid(vv?vv.outpoint:'',18)}</div><div style="margin-top:4px">${sats(amt)} · ${vv?esc(vv.state):''}</div>`,e=>[e.clientX,e.clientY]);
      g.addEventListener('click',()=>location.hash='#/vtxo/'+encodeURIComponent(vv?vv.outpoint:t.txid+':'+out.vout));
      if(vv&&vv.spentByTx){
        txt(g,0,r+30,'→ '+mid(vv.spentByTx,7)+' spent',{fs:9,fill:'#6B7686',anchor:'middle'});
        const hit2=svgEl('rect',{x:-70,y:r+22,width:140,height:16,fill:'transparent',style:'cursor:pointer'},g);
        hit2.addEventListener('click',e=>{e.stopPropagation();location.hash='#/tx/'+vv.spentByTx;});
        bindTip(hit2,`<div class="tt">spent by${VTX[vv.spentByTx]?'':' (not in snapshot)'}</div><div class="tx">${vv.spentByTx}</div>`,e=>[e.clientX,e.clientY]);
      }else if(vv){
        txt(g,0,r+30,'vtxo · '+esc(vv.state),{fs:9,fill:'#5E6879',anchor:'middle'});

    });
    if(outputs.length) txt(svg,20,ty+52,'outputs',{fs:9.5,fill:'#5E6879'});
    if(hasSpine) line(svg,24,spineY0-15,W-24,spineY0-15,{stroke:'#1E2532',w:1});
  }
  // ---------- spine ----------
  if(hasSpine){
    const bot=drawSpineEntries(svg,entries,cx,spineY0,{rowH,W,labelFs:vertical?13:10,subFs:vertical?10:8,labelX:vertical?16:18,hitW:vertical?Math.min(300,W-cx-34):undefined});
    if(bot+24>H){ svg.setAttribute('viewBox',`0 0 ${W} ${bot+24}`); svg.setAttribute('height',bot+24); }
  }else{
    txt(svg,cx,spineY0+16,chain?'unroll path elided in this snapshot':'no unroll path in this snapshot',{fs:10,fill:'#5E6879',anchor:'middle'});
  }
}
/* Shared "subway spine" drawer — used by the VTXO unroll view and the merged tx map.
   Draws entries top→down at x=cx starting at y0; returns the bottom y. */
function drawSpineEntries(svg, entries, cx, y0, opts={}){
  const rowH=opts.rowH||30;
  const W=opts.W||900;
  const labelX=opts.labelX!=null?opts.labelX:18;
  const fsL=opts.labelFs||10, fsS=opts.subFs||8;
  const hitW=opts.hitW||Math.min(380,W-cx-labelX-16);
  const pathG=opts.group||svgEl('g',{},svg);
  const spineBot=y0+entries.length*rowH;
  line(pathG,cx,y0-8,cx,spineBot+8,{stroke:'#2A3344',w:1.4});
  const typeColor={ark:'#8FB8FF',checkpoint:'#6C7BD9',tree:'#9AA4B5',commitment:'#F2A93B'};
  let y=y0;
  for(let i=0;i<entries.length;i++){
    const e=entries[i];
    if(e.gap){
      const g=svgEl('g',{class:'gap-cap',style:'cursor:pointer'},pathG);
      const w=Math.min(220,W-40),h=22;
      svgEl('rect',{x:cx-w/2,y:y-h/2,width:w,height:h,rx:6,class:'cap-box'},g);
      txt(g,cx,y+3,`… ${e.gap} hops compressed`,{fs:9.5,fill:'#9AA4B5',anchor:'middle'});
      bindTip(g,`<div class="tt">compressed segment</div>${e.gap} chain entries elided by the indexer.`,ev=>[ev.clientX,ev.clientY]);
      line(pathG,cx,y+11,cx,y+rowH-11,{stroke:'#2A3344',w:1.2,dash:'2 3'});
      y+=rowH; continue;
    }
    const ty=e.type;
    const col=typeColor[ty]||'#9AA4B5';
    const g=svgEl('g',{transform:`translate(${cx} ${y})`,style:'cursor:pointer'},pathG);
    if(ty==='ark'){
      svgEl('rect',{x:-8,y:-5,width:16,height:10,rx:5,fill:'#10182B',stroke:col,'stroke-width':1.3},g);
    } else if(ty==='checkpoint'){
      svgEl('circle',{r:6,fill:'none',stroke:col,'stroke-width':1.4},g);
      svgEl('circle',{r:2,fill:col},g);
    } else if(ty==='tree'){
      svgEl('path',{d:'M-7 0 L0 -6 L7 0 L0 6 Z',fill:'none',stroke:col,'stroke-width':1.3},g);
    } else if(ty==='commitment'){
      diamond(g,0,0,7,{stroke:col,fill:'#1A150C'});
    }
    // checkpoints/trees are never indexed — only ark/commitment rows can be "missing"
    const miss = (ty==='ark'&&!VTX[e.txid]) || (ty==='commitment'&&!COMMIT[e.txid]);
    const hasData = !miss;
    txt(g,labelX,3,mid(e.txid,10),{fs:fsL,fill:hasData?'#E6EAF2':'#9AA4B5'});
    txt(g,labelX,14,ty+(miss?' · not in snapshot':''),{fs:fsS,fill:'#5E6879'});
    if(ty==='commitment'&&COMMIT[e.txid]){
      const c=COMMIT[e.txid];
      txt(g,labelX,24,`block ${c.onchain.blockHeight} · ${ago(c.endedAt)}`,{fs:fsS,fill:'#5E6879'});
    }
    const hit=svgEl('rect',{x:-16,y:-13,width:hitW,height:rowH-2,fill:'transparent'},g);
    hit.style.cursor='pointer';
    g.addEventListener('click',()=>{
      if(ty==='commitment'&&COMMIT[e.txid]) location.hash='#/commitment/'+e.txid;
      else if(ty==='ark'&&VTX[e.txid]) location.hash='#/tx/'+e.txid;
      else if(ty==='tree'&&COMMIT[e.txid]) location.hash='#/commitment/'+e.txid;
      else window.open('https://mempool.space/tx/'+e.txid,'_blank');
    });
    bindTip(g,`<div class="tt">${ty}</div><div class="tx">${e.txid}</div>${hasData?'':'<div style="margin-top:4px;color:var(--text-3)">not in this snapshot</div>'}`,ev=>[ev.clientX,ev.clientY]);
    y+=rowH;
  }
  // anchor block tile below the last commitment
  const lastCommit=entries.filter(e=>e.type==='commitment').pop();
  if(lastCommit&&COMMIT[lastCommit.txid]){
    const c=COMMIT[lastCommit.txid];
    const by=y+8;
    line(pathG,cx,y-4,cx,by-9,{stroke:'#F2A93B',w:1.2});
    const g=svgEl('g',{transform:`translate(${cx} ${by})`,style:'cursor:pointer'},pathG);
    svgEl('rect',{x:-7,y:-7,width:14,height:14,fill:'#161C28',stroke:'#F2A93B','stroke-width':1.3},g);
    txt(g,0,22,'block '+c.onchain.blockHeight,{fs:9,fill:'#F2A93B',anchor:'middle'});
    g.addEventListener('click',()=>location.hash='#/commitment/'+lastCommit.txid);
    bindTip(g,`<div class="tt">anchor block</div>block ${c.onchain.blockHeight} · ${ago(c.onchain.blockTime||c.endedAt)}`,ev=>[ev.clientX,ev.clientY]);
    return by+30;
  }
  return y+14;
}
function buildUnroll(chain,t,focusVtxo=false){

function buildTree(c){
  const svg=$('#treeSvg');svg.innerHTML='';
  const W=900;
  const batches=c.batches||[];
  const trees=c.trees||{};
  // columns: aux (connectors/forfeits) | batch | tree root | leaves
  const ax=70, bx=210, tx=430, lx=680;
  const rowH=64;
  let y=44;
  const edge='#3A4557';
  // aux nodes (connectors + forfeits) drawn once at left, linked to first batch row
  const auxItems=[];
  for(let i=0;i<c.connectorCount;i++)auxItems.push({kind:'connector',i});
  for(const f of c.forfeitTxids||[])auxItems.push({kind:'forfeit',txid:f});
  // compute total height
  let totalH=60;
  for(const b of batches){
    const leaves=trees[String(b.vout)]||trees[b.vout]||[];
    totalH+=Math.max(rowH, 30+leaves.length*34);
  }
  if(auxItems.length) totalH=Math.max(totalH, auxItems.length*24+50);
  const H=Math.max(240,totalH+30);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('height',H);
  // draw aux column
  if(auxItems.length){
    txt(svg,ax,20,'commit aux',{fs:8,fill:'#5E6879',anchor:'middle'});
    auxItems.forEach((a,i)=>{
      const ay=50+i*24;
      const g=svgEl('g',{transform:`translate(${ax} ${ay})`,style:a.kind==='forfeit'?'cursor:pointer':'default'},svg);
      if(a.kind==='connector'){
        svgEl('circle',{r:5,fill:'none',stroke:'#6C7BD9','stroke-width':1.3},g);
        svgEl('circle',{r:1.6,fill:'#6C7BD9'},g);
        txt(g,12,3,'connector',{fs:8.5,fill:'#9AA4B5'});
      }else{
        svgEl('path',{d:'M-4 -4 L4 4 M4 -4 L-4 4',stroke:'#FF6464','stroke-width':1.5},g);
        txt(g,12,3,'forfeit '+mid(a.txid,6),{fs:8.5,fill:'#FF6464'});
        g.addEventListener('click',()=>window.open('https://mempool.space/tx/'+a.txid,'_blank'));
        bindTip(g,`<div class="tt">forfeit tx</div><div class="tx">${a.txid}</div><div style="margin-top:4px">operator claim path if a VTXO expires in the exit window</div>`,e=>[e.clientX,e.clientY]);
      }
      // link to first batch row center
      const firstBatchY=y+ (batches.length? Math.min(rowH,30+(trees[String(batches[0].vout)]||trees[batches[0].vout]||[]).length*34)/2 :0);
      line(svg,ax+18,ay,bx-14,firstBatchY,{stroke:edge,w:.8,dash:'2 3',o:.6});
    });
  }
  // batches
  for(const b of batches){
    const vout=b.vout;
    const leaves=trees[String(vout)]||trees[vout]||[];
    const cy=y+ (leaves.length? (leaves.length*34)/2 : rowH/2);
    // batch node
    const g=svgEl('g',{transform:`translate(${bx} ${cy})`},svg);
    svgEl('rect',{x:-8,y:-8,width:16,height:16,rx:2,fill:'#10182B',stroke:'#F2A93B','stroke-width':1.4},g);
    txt(g,20,-2,'batch vout '+vout,{fs:10.5,fill:'#E6EAF2'});
    txt(g,20,10,sats(b.amount)+' · '+b.vtxoCount+' vtxo'+(b.vtxoCount===1?'':'s')+(b.swept?' · swept':''),{fs:8.5,fill:b.swept?'#FF6464':'#5E6879'});
    txt(g,20,21,'expires '+(b.expiresAt?until(b.expiresAt):'—'),{fs:8,fill:'#5E6879'});
    bindTip(g,`<div class="tt">batch output vout ${vout}</div><div style="margin-top:4px">${sats(b.amount)} · ${b.vtxoCount} VTXOs${b.swept?' · swept':''}</div>`,e=>[e.clientX,e.clientY]);
    if(leaves.length){
      // tree root
      const rootY=cy;
      const tg=svgEl('g',{transform:`translate(${tx} ${rootY})`},svg);
      svgEl('path',{d:'M-9 -8 L0 -15 L9 -8 L0 -1 Z',fill:'#10182B',stroke:'#9AA4B5','stroke-width':1.3},tg);
      // labels below the node so leaf connectors never strike through them
      txt(tg,14,11,'tree root',{fs:8.5,fill:'#9AA4B5'});
      txt(tg,14,21,leaves.length===1?'single leaf':leaves.length+' leaves',{fs:8,fill:'#5E6879'});
      line(svg,bx+10,cy,tx-12,cy,{stroke:edge,w:1.2});
      // leaves fan out vertically around root
      const spread=Math.min(120,(leaves.length-1)*34);
      leaves.forEach((leaf,li)=>{
        const ly=rootY-spread/2+li*(leaves.length>1?spread/(leaves.length-1):0);
        // connector root->leaf
        line(svg,tx+11,ly-6,lx-14,ly,{stroke:edge,w:1});
        // leaf vtxo circle
        const lg=svgEl('g',{transform:`translate(${lx} ${ly})`,style:'cursor:pointer'},svg);
        vtxoCircle(lg,0,0,8,{ring:null,label:''});
        txt(lg,0,22,mid(leaf.txid,9),{fs:9,fill:'#E6EAF2',anchor:'middle'});
        const vt=VTX[leaf.txid];
        txt(lg,0,33,vt?vt.kind+' · '+vt.state:'vtxo tx',{fs:8,fill:'#5E6879',anchor:'middle'});
        bindTip(lg,`<div class="tt">tree leaf · vtxo tx</div><div class="tx">${leaf.txid}</div>${vt?'<div style="margin-top:4px">'+esc(vt.kind)+' · '+chip(vt.state)+'</div>':''}`,e=>[e.clientX,e.clientY]);
        lg.addEventListener('click',()=>{ if(VTX[leaf.txid]) location.hash='#/tx/'+leaf.txid; else window.open('https://mempool.space/tx/'+leaf.txid,'_blank'); });
      });
    } else {
      txt(svg,tx,cy,'no tree data',{fs:9,fill:'#5E6879',anchor:'middle'});
      line(svg,bx+10,cy,tx-12,cy,{stroke:edge,w:1.2});
    }
    y+=Math.max(rowH,30+leaves.length*34)+18;
  }
  if(!batches.length) txt(svg,W/2,H/2,'no batch outputs',{fs:11,fill:'#5E6879',anchor:'middle'});
  txt(svg,W/2,H-8,'batch → tree root → leaf VTXO txs · leaf txids link to virtual txs',{fs:8.5,fill:'#5E6879',anchor:'middle'});
}

  let h=`<h3>Commitment</h3>
  <div class="fact-hero"><div class="big">${satsShort(c.totalOutputAmount||oc.inputs.reduce((s,i)=>s+i.amount,0))}</div><div class="lbl">batch output value</div></div>
  <div class="fact-row"><span class="k">state</span><span class="v">${chip(oc.confirmed?'confirmed':'mempool')} · ${oc.confirmations} conf</span></div>
  <div class="fact-row"><span class="k">block</span><span class="v">${oc.blockHeight} · ${dthhmm(oc.blockTime||c.endedAt)}</span></div>
  <div class="fact-row"><span class="k">session</span><span class="v">${durExact(durS)} (${dthhmm(c.startedAt)} → ${dthhmm(c.endedAt).slice(6)})</span></div>
  <div class="fact-row"><span class="k">vtxos in</span><span class="v">${c.totalInputVtxos}</span></div>
  <div class="fact-row"><span class="k">batches</span><span class="v">${c.batches.length}</span></div>
  <div class="fact-row"><span class="k">connectors</span><span class="v">${c.connectorCount}</span></div>
  <div class="fact-row"><span class="k">forfeits</span><span class="v">${c.forfeitCount}</span></div>
  <div class="fact-row"><span class="k">fee</span><span class="v">${sats(oc.fee)} · ${oc.vsize} vB · ${oc.feeRate} sat/vB</span></div>
  <div class="fact-row"><span class="k">weight/size</span><span class="v">${oc.weight} WU · ${oc.size} B</span></div>
  <div class="d-sec"><h5>Identifiers</h5>
    <div class="fact-row"><span class="k">txid</span><span class="v">${mid(c.txid,14)}<button class="copybtn" data-copy="${c.txid}" aria-label="Copy" title="Copy">${iconCopy}</button></span></div>
    <div class="fact-row"><span class="k">block hash</span><span class="v">${mid(oc.blockHash||'',14)}<button class="copybtn" data-copy="${oc.blockHash||''}" aria-label="Copy" title="Copy">${iconCopy}</button></span></div>
  </div>
  <div class="d-actions"><a href="https://mempool.space/tx/${c.txid}" target="_blank" rel="noopener">mempool.space ↗</a></div>`;
  f.innerHTML=h;
  f.querySelectorAll('.copybtn').forEach(b=>b.addEventListener('click',async()=>{await copyBtn(b.dataset.copy);b.innerHTML='✓';setTimeout(()=>b.innerHTML=iconCopy,1200);}));
}

/* ============================================================
   ADDRESS VIEW — constellation
   ============================================================ */
function renderAddress(id){
  let a=ADDR[id];
  let partial=false;
  if(!a){
    // synthesize partial from virtualTxs inputs/outputs
    const hits=[];
    for(const t of Object.values(VTX)){
      for(const i of t.inputs) if(i.address===id) hits.push({t,out:i.vtxo,outpoint:i.outpoint});
      for(const o of t.outputs) if(o.address===id&&o.vtxo) hits.push({t,out:o.vtxo,outpoint:o.vtxo.outpoint});
    }
    if(!hits.length){ renderNotFound(id,'address'); return; }
    partial=true;
    a={address:id,totalVtxos:new Set(hits.map(h=>h.outpoint)).size,listedVtxos:hits.length,vtxos:hits.map(h=>({...h.out,spentByTx:h.out.spentByTx})),summary:null};
  }
  // partial synth may still see the same outpoint twice (input + output views) — dedupe only that case
  if(partial&&a&&a.vtxos){
    const seen=new Set();
    a={...a,vtxos:a.vtxos.filter(v=>{const k=v.outpoint;if(seen.has(k))return false;seen.add(k);return true;})};
  }
  const app=$('#app');
  const sum=a.summary;
  const nearest=sum?sum.nearestExpiry:null;
  app.innerHTML=`
  <section class="addr-wrap">
    <div>
      <div class="sec-head"><h2>Address</h2><span class="sub mono" style="font-size:11px">${mid(id,20)}</span>${partial?'<span class="chip">partial</span>':''}</div>
      <div class="canvas-card detail-canvas"><div class="canvas-head"><span class="micro">constellation</span><span class="hint">VTXOs clustered by commitment ◆ · ring = lifetime left · coral = exit window · faint = spent</span></div>
        <svg class="const-svg" id="constSvg" viewBox="0 0 800 560" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="canvas-card" style="margin-top:14px"><div class="canvas-head"><span class="micro">vtxos</span><span class="hint">sorted by urgency · ${a.vtxos.length} of ${NF.format(a.totalVtxos)} listed${partial?' · synthesized from snapshot':''}</span></div>
        <div class="table-wrap" style="border:0;border-radius:0"><table class="vtxo-table"><thead><tr><th>Outpoint</th><th>Amount</th><th>State</th><th>Expires</th><th>Commitment</th></tr></thead><tbody id="vtxoBody"></tbody></table></div>
      </div>
    </div>
    <aside class="facts" id="facts"></aside>
  </section>`;
  buildConstellation(a);
  buildVtxoTable(a);
  buildAddrFacts(a,partial);
}
function buildConstellation(a){
  const svg=$('#constSvg');svg.innerHTML='';
  const W=800,H=560;
  const vtxos=a.vtxos||[];
  const clusters=new Map();
  for(const v of vtxos){
    const key=v.commitmentTxid||'none';
    if(!clusters.has(key))clusters.set(key,[]);
    clusters.get(key).push(v);
  }
  const spentStates=new Set(['spent','swept','refreshed','expired']);
  // clusters needing action (renew/expired inside) sort first, then by live count
  const urgencyOf=vs=>vs.some(v=>v.state==='renew'||v.state==='expired')?0:1;
  const cl=[...clusters.entries()].sort((x,y)=>{
    const d=urgencyOf(x[1])-urgencyOf(y[1]); if(d)return d;
    const lx=x[1].filter(v=>!spentStates.has(v.state)).length, ly=y[1].filter(v=>!spentStates.has(v.state)).length;
    return ly-lx;
  });
  const n=cl.length;
  const cols=n<=3?n: n<=6?3:4;
  const rows=Math.ceil(n/cols);
  const cw=W/cols, ch=(H-64)/rows;
  const edge='#232B3B';
  cl.forEach(([cid,vs],idx)=>{
    const col=idx%cols,row=Math.floor(idx/cols);
    const cx=cw*col+cw/2;
    const cellTop=56+ch*row;
    const cellBot=cellTop+ch;
    const dead=vs.every(v=>spentStates.has(v.state));
    // anchor diamond centered above each cluster + one compact label line
    const c=cid!=='none'?COMMIT[cid]:null;
    const lblY=cellTop+22;
    if(cid!=='none'){
      const dg=diamond(svg,cx,cellTop+9,4.5,{stroke:'#F2A93B',fill:'#1A150C',w:1});
      dg.style.cursor='pointer';
      dg.addEventListener('click',()=>location.hash='#/commitment/'+cid);
      bindTip(dg,`<div class="tt">commitment cluster</div><div class="tx">${cid}</div><div style="margin-top:4px">${vs.length} VTXOs</div>`,e=>[e.clientX,e.clientY]);
      txt(svg,cx,lblY,`${mid(cid,6)}${c&&c.onchain.blockHeight?' · blk '+c.onchain.blockHeight:''} · ×${vs.length}${dead?' · history':''}`,{fs:8,fill:'#9AA4B5',anchor:'middle'});
    }else{
      txt(svg,cx,lblY,`unanchored · ×${vs.length}${dead?' · history':''}`,{fs:8,fill:'#5E6879',anchor:'middle'});
    }
    // cluster sits below the label line with consistent spacing
    const availBot=cellBot-8, availTop=lblY+12;
    const cy=availTop+(availBot-availTop)/2;
    const maxR=Math.min(cw*0.44,(availBot-availTop)*0.52,Math.min(cw,ch)*0.36);
    const baseR=Math.max(26,Math.min(maxR,22+Math.sqrt(vs.length)*6));
    const golden=2.39996;
    const smallN=vs.length<=4;
    // live rings pack the center, dead/spent rings dim on the rim
    vs.sort((p,q)=>(spentStates.has(p.state)?1:0)-(spentStates.has(q.state)?1:0)||(p.expiresAt||0)-(q.expiresAt||0));
    // ring radius tiers keep dense clusters legible inside the fixed cell
    const cr=vs.length>18?4.5:vs.length>8?5.5:7;
    vs.forEach((v,i)=>{
      const t=i+0.5;
      let x,y;
      if(vs.length===1){ x=cx; y=cy; }
      else if(smallN){
        // tiny clusters: even angular spacing on a compact ring
        const ang=-Math.PI/2+i*(Math.PI*2/vs.length), rr=baseR*0.5;
        x=cx+Math.cos(ang)*rr; y=cy+Math.sin(ang)*rr*0.85;
      }else{
        // phyllotaxis disk — uniform density, no overlaps
        const ang=i*golden-Math.PI/2, rr=baseR*Math.sqrt(t/vs.length)*0.9;
        x=cx+Math.cos(ang)*rr; y=cy+Math.sin(ang)*rr;
      }
      const isDead=spentStates.has(v.state);
      const frac=v.expiresAt&&v.createdAt?Math.max(0,Math.min(1,(v.expiresAt-now())/(v.expiresAt-v.createdAt||1))):null;
      const alert=v.state==='renew'||v.state==='expired';
      const g=svgEl('g',{transform:`translate(${x} ${y})`,style:'cursor:pointer',opacity:isDead?0.4:1},svg);
      if(frac!=null&&!isDead){
        const circ=2*Math.PI*(cr+2);
        svgEl('circle',{r:cr+2,fill:'none',stroke:'#1E2532','stroke-width':1.6},g);
        svgEl('circle',{r:cr+2,fill:'none',stroke:alert?'#FF6464':'#5ED6AE','stroke-width':1.6,'stroke-linecap':'round','stroke-dasharray':`${circ*Math.max(0.03,frac)} ${circ}`,'transform':'rotate(-90)'},g);
      }
      svgEl('circle',{r:cr,fill:isDead?'#0E1118':'#10182B',stroke:alert?'#FF6464':isDead?'#2A3344':'#E6EAF2','stroke-width':1.2,'stroke-dasharray':isDead?'2 2':'0'},g);
      if(alert&&!isDead)svgEl('circle',{r:cr+3.5,fill:'none',stroke:'#FF6464','stroke-width':1},g);
      if(cid!=='none')line(svg,cx,cy-8,x,y,{stroke:edge,w:.5,o:.4});
      bindTip(g,`<div class="tt">vtxo · ${esc(v.state)}</div><div class="tx">${mid(v.outpoint,16)}</div><div style="margin-top:4px">${sats(v.amount)} · expires ${v.expiresAt?until(v.expiresAt):'—'}</div>`,e=>[e.clientX,e.clientY]);
      g.addEventListener('click',()=>location.hash='#/vtxo/'+encodeURIComponent(v.outpoint));
    });
  });
  txt(svg,W/2,H-10,'clusters = commitment anchors · ring arc = lifetime remaining · coral = exit window · dashed/faint = spent',{fs:9.5,fill:'#6B7686',anchor:'middle'});
}
function vs_count(vs){return vs.length;}
function buildVtxoTable(a){
  const tb=$('#vtxoBody');
  const urgency=v=>{
    if(v.state==='renew')return 0; if(v.state==='expired')return 1;
    if(v.state==='preconfirmed')return 2; if(v.state==='settled')return 3;
    if(v.state==='refreshed')return 4; return 5;
  };
  const sorted=[...(a.vtxos||[])].sort((x,y)=>urgency(x)-urgency(y)||(x.expiresAt||1e15)-(y.expiresAt||1e15));
  tb.innerHTML=sorted.slice(0,120).map(v=>{
    const cid=v.commitmentTxid;
    return `<tr data-op="${esc(v.outpoint)}">
      <td style="word-break:break-all">${mid(v.outpoint,12)}</td>
      <td>${sats(v.amount)}</td>
      <td>${chip(v.state)}</td>
      <td style="color:${v.expiresAt&&v.expiresAt-now()<7*86400?'var(--alert)':'var(--text-2)'}">${v.expiresAt?dthhmm(v.expiresAt)+' · '+until(v.expiresAt):'—'}</td>
      <td>${cid?`<a href="#/commitment/${cid}" class="mono" style="color:var(--chain);font-size:10px">${mid(cid,7)}</a>`:'—'}</td>
    </tr>`;
  }).join('');
  tb.querySelectorAll('tr').forEach(tr=>tr.addEventListener('click',()=>location.hash='#/vtxo/'+encodeURIComponent(tr.dataset.op)));
}
function buildAddrFacts(a,partial){
  const f=$('#facts');
  const s=a.summary;
  const nearest=s?s.nearestExpiry:null;
  let h=`<h3>Address</h3>
  <div class="fact-hero"><div class="big">${s?satsShort(s.spendable+s.renew+(s.expired||0)):'—'}</div><div class="lbl">unspent</div></div>
  <div class="fact-row"><span class="k">total vtxos</span><span class="v">${NF.format(a.totalVtxos)}${a.vtxos.length<a.totalVtxos?' <span style="color:var(--text-3)">('+a.vtxos.length+' listed)</span>':''}</span></div>
  ${s?`
  <div class="fact-row"><span class="k">healthy</span><span class="v">${sats(s.spendable)}</span></div>
  <div class="fact-row"><span class="k">in exit window</span><span class="v" style="color:${s.renew?'var(--alert)':'inherit'}">${s.renew?sats(s.renew)+' · '+s.counts.renew+' vtxo'+(s.counts.renew===1?'':'s'):s.counts.renew+' vtxos'}</span></div>
  <div class="fact-row"><span class="k">expired</span><span class="v">${s.expired?sats(s.expired):'0'}</span></div>
  <div class="fact-row"><span class="k">received</span><span class="v">${sats(s.received)}</span></div>
  `:''}
  ${nearest?`<div class="fact-row"><span class="k">nearest expiry</span><span class="v" style="color:${nearest-now()<7*86400?'var(--alert)':'inherit'}">${dthhmm(nearest)} · ${until(nearest)}</span></div>`:''}
  ${partial?'<div class="hint" style="margin-top:8px;font-size:11px;color:var(--text-3)">Partial view — synthesized from transactions in this snapshot; the operator index was not queried for this address.</div>':''}
  ${s&&s.renew?`<div class="needs-card"><div class="ttl">⚠ needs action</div><div class="txt">${s.counts.renew} VTXO${s.counts.renew===1?'':'s'} inside the exit window — renew before expiry or they can be swept.</div><div class="when">nearest expiry ${until(nearest)}</div></div>`:''}
  <div class="d-sec"><h5>Script</h5><div class="fact-row"><span class="k">script</span><span class="v" style="font-size:10px">${esc(a.script||'')}</span></div></div>
  <div class="d-actions">${watchBtnHTML('address',a.address,a.address.slice(0,12))}<button class="watchbtn" id="copyAddr" style="border-style:dashed">copy address</button></div>`;
  f.innerHTML=h;
  f.querySelector('#copyAddr')?.addEventListener('click',async()=>{await copyBtn(a.address);f.querySelector('#copyAddr').textContent='copied ✓';setTimeout(()=>f.querySelector('#copyAddr').textContent='copy address',1200);});
  f.querySelector('[data-watch]')?.addEventListener('click',e=>{const parts=e.currentTarget.dataset.watch.split(/:(.+)/);toggleWatch(parts[1],parts[2],a.address.slice(0,12));e.currentTarget.outerHTML=watchBtnHTML('address',a.address);});
}

/* ============================================================
   NOT FOUND
   ============================================================ */
function renderNotFound(id,what){
  $('#app').innerHTML=`<div class="notfound">
    <h1>Not in this snapshot</h1>
    <p>The ${esc(what)} <span class="mono">${esc(mid(id,20))}</span> isn't in the captured data pack. It may be older than the window, belong to an unobserved lane, or be mistyped.</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <a class="tbtn" href="https://mempool.space/tx/${esc(id)}" target="_blank" rel="noopener">mempool.space ↗</a>
      <a class="tbtn" href="#/">Back to overview</a>
    </div>
    <div style="margin-top:18px"><input id="nfSearch" placeholder="try another txid or address" style="width:100%;max-width:380px;height:36px;padding:0 12px;background:var(--panel);border:1px solid var(--line-2);border-radius:7px;font-family:var(--mono);font-size:12px" autofocus></div>
  </div>`;
  $('#nfSearch')?.addEventListener('keydown',e=>{if(e.key==='Enter'){doSearch(e.target.value);}});
}

/* ============================================================
   SEARCH / OMNIBOX
   ============================================================ */
const searchInput=$('#searchInput'),suggest=$('#suggest');
let sugSel=-1,sugItems=[];
function detectType(q){
  q=q.trim();
  if(/^[0-9a-fA-F]{64}$/.test(q)) return {type:'txid',q};
  if(/^[0-9a-fA-F]{64}:[0-9]+$/.test(q)) return {type:'vtxo',q};
  if(/^ark1[a-z0-9]+$/.test(q)) return {type:'address',q};
  if(/^[0-9a-fA-F]{20,}$/.test(q)&&q.length<64) return {type:'script',q};
  if(/^[0-9]{4,7}$/.test(q)) return {type:'block',q:+q};
  return {type:'text',q};
}
function doSearch(q){
  q=(q||'').trim(); if(!q)return;
  const d=detectType(q);
  if(d.type==='txid'){
    if(VTX[d.q]) location.hash='#/tx/'+d.q;
    else if(COMMIT[d.q]) location.hash='#/commitment/'+d.q;
    else location.hash='#/tx/'+d.q; // will render not-found with mempool link
  } else if(d.type==='vtxo'){
    location.hash='#/vtxo/'+d.q;
  } else if(d.type==='address'){
    location.hash='#/address/'+encodeURIComponent(d.q);
  } else if(d.type==='block'){
    const b=blockByHeight.get(d.q)||D.chain.blocks.find(x=>Math.abs(x.height-d.q)<3);
    if(b) location.hash='#/commitment/'+(Object.values(COMMIT).find(c=>c.onchain.blockHeight===b.height)?.txid||'')||'#/';
    else location.hash='#/';
  } else {
    // try partial match suggestions
    const hits=suggestItems(q).slice(0,1);
    if(hits.length) navigateHit(hits[0]); else suggest.innerHTML='';
  }
  suggest.innerHTML='';searchInput.blur();
}
function navigateHit(h){
  if(h.kind==='tx')location.hash='#/tx/'+h.id;
  else if(h.kind==='commit')location.hash='#/commitment/'+h.id;
  else if(h.kind==='addr')location.hash='#/address/'+encodeURIComponent(h.id);
  else if(h.kind==='vtxo')location.hash='#/vtxo/'+h.id;
  else if(h.kind==='block'){const c=Object.values(COMMIT).find(x=>x.onchain.blockHeight===h.id);location.hash=c?'#/commitment/'+c.txid:'#/';}
}
function suggestItems(q){
  q=q.toLowerCase();const out=[];
  if(q.length<2)return out;
  for(const id of Object.keys(VTX)) if(id.toLowerCase().includes(q)) out.push({kind:'tx',id,label:VTX[id].kind+' · '+VTX[id].state});
  for(const id of Object.keys(COMMIT)) if(id.toLowerCase().includes(q)) out.push({kind:'commit',id,label:'commitment · blk '+COMMIT[id].onchain.blockHeight});
  for(const id of Object.keys(ADDR)) if(id.toLowerCase().includes(q)) out.push({kind:'addr',id,label:'address · '+ADDR[id].totalVtxos+' vtxos'});
  for(const id of Object.keys(CHAIN)) if(id.toLowerCase().includes(q)) out.push({kind:'vtxo',id,label:'vtxo · depth '+(CHAIN[id].length-CHAIN[id].counts.commitment)});
  for(const b of D.chain.blocks) if(String(b.height).includes(q)) out.push({kind:'block',id:b.height,label:'block · '+hhmm(b.time)});
  return out.slice(0,9);
}
function renderSuggest(){
  const q=searchInput.value.trim();
  sugItems=suggestItems(q);sugSel=-1;
  if(!q||detectType(q).type!=='text'&&q.length>=4&&!['txid','vtxo','address','block','script'].includes(detectType(q).type)){suggest.innerHTML='';return;}
  if(!sugItems.length){suggest.innerHTML='';return;}
  suggest.innerHTML=sugItems.map((s,i)=>`<button class="sug" role="option" data-i="${i}"><span class="k">${s.kind}</span><span class="v">${esc(s.id)}</span><span style="color:var(--text-3);font-size:10.5px;margin-left:auto">${esc(s.label)}</span></button>`).join('');
  $$('.sug',suggest).forEach(b=>{
    b.addEventListener('click',()=>navigateHit(sugItems[+b.dataset.i]));
    b.addEventListener('pointerenter',()=>{sugSel=+b.dataset.i;$$('.sug',suggest).forEach(x=>x.classList.toggle('sel',+x.dataset.i===sugSel));});
  });
}
searchInput.addEventListener('input',renderSuggest);
searchInput.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();sugSel=Math.min(sugSel+1,sugItems.length-1);$$('.sug',suggest).forEach((x,i)=>x.classList.toggle('sel',i===sugSel));}
  else if(e.key==='ArrowUp'){e.preventDefault();sugSel=Math.max(sugSel-1,0);$$('.sug',suggest).forEach((x,i)=>x.classList.toggle('sel',i===sugSel));}
  else if(e.key==='Enter'){e.preventDefault();if(sugSel>=0&&sugItems[sugSel])navigateHit(sugItems[sugSel]);else doSearch(searchInput.value);}
  else if(e.key==='Escape'){suggest.innerHTML='';}
});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.search-wrap'))suggest.innerHTML='';});
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==searchInput&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();searchInput.focus();}});

/* close jargon popovers on outside click */
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.jarg'))$$('.pop.open').forEach(x=>x.classList.remove('open'));});

/* inspector close button delegation */
inspector.addEventListener('click',e=>{if(e.target.classList.contains('d-x')||e.target.id==='dClose')closeDrawer();});

/* openInspector with close btn helper */
const _openInspector=openInspector;
openInspector=function(html){_openInspector(`<button class="d-x" id="dClose" aria-label="Close inspector" style="position:absolute;top:14px;right:14px">✕</button>`+html);};

/* atlas node click → inspector for non-routable? Actually nodes route directly. Keep drawer for blocks without commitment. */

/* boot */
route();
</script>
