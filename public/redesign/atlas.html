<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ark.observer — Atlas</title>
<style>
@font-face{font-family:'IS';src:url('fonts/instrument-sans-var.woff2') format('woff2');font-weight:100 900;font-stretch:75% 100%;font-display:swap}
@font-face{font-family:'MM';src:url('fonts/martian-mono-var.woff2') format('woff2');font-weight:100 800;font-stretch:75% 112.5%;font-display:swap}
@font-face{font-family:'GM';src:url('fonts/geist-mono-var.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{
  --bg:#0B0E14; --bg-2:#0F131B; --panel:#121722; --panel-2:#161C28;
  --line:#1E2532; --line-2:#2A3344;
  --text:#E6EAF2; --text-2:#9AA4B5; --text-3:#5E6879;
  --chain:#F2A93B; --virt:#8FB8FF; --cp:#6C7BD9; --vtxo:#E6EAF2;
  --alert:#FF6464; --ok:#5ED6AE;
  --arkade:#8FB8FF; --second:#F2A93B;
  --r:8px;
  --mono:'MM',ui-monospace,monospace;
  --sans:'IS',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
::selection{background:#2A3344}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--virt);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--mono)}
.micro{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-stretch:87.5%}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;height:52px;padding:0 16px;background:rgba(11,14,20,.92);border-bottom:1px solid var(--line);backdrop-filter:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{display:block}
.mode-tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--text-3);border:1px solid var(--line-2);border-radius:4px;padding:2px 6px;text-transform:uppercase}
.search-wrap{position:relative;flex:1;max-width:520px;margin:0 auto}
.search-box{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;background:var(--panel);border:1px solid var(--line-2);border-radius:7px}
.search-box:focus-within{border-color:var(--virt)}
.search-box input{flex:1;background:none;border:0;outline:0;font-family:var(--mono);font-size:12.5px;color:var(--text);min-width:0}
.search-box input::placeholder{color:var(--text-3);font-family:var(--sans)}
.search-box kbd{font-family:var(--mono);font-size:10px;color:var(--text-3);border:1px solid var(--line-2);border-radius:3px;padding:1px 4px}
.suggest{position:absolute;top:38px;left:0;right:0;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.5);z-index:70;max-height:320px;overflow-y:auto}
.suggest:empty{display:none}
.sug{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;text-align:left;font-size:12.5px}
.sug:hover,.sug.sel{background:var(--panel-2)}
.sug .k{color:var(--text-3);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;width:74px;flex:none}
.sug .v{font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:8px}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line-2);border-radius:7px;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.tbtn:hover{color:var(--text);border-color:#3A4557;background:var(--panel)}
.tbtn[aria-pressed="true"]{color:var(--text);border-color:var(--virt);background:#16202F}
.tbtn .cnt{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.switcher{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.switcher a{padding:5px 9px;font-size:11.5px;color:var(--text-3);white-space:nowrap}
.switcher a:hover{color:var(--text);background:var(--panel)}
.switcher a.cur{color:var(--text);background:var(--panel-2);font-weight:600}

/* ---------- layout ---------- */
main{max-width:1560px;margin:0 auto;padding:0 20px 80px}
section{margin-top:22px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sec-head h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
.sec-head .sub{color:var(--text-3);font-size:12px}
.sec-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ---------- canvas ---------- */
.canvas-card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.canvas-card .canvas-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{padding:4px 11px;font-size:11.5px;color:var(--text-3);font-family:var(--mono);font-size:10.5px;letter-spacing:.04em}
.seg button.on{background:var(--panel-2);color:var(--text)}
.seg button:hover:not(.on){color:var(--text-2)}
.canvas-meta{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-3);letter-spacing:.04em;white-space:nowrap}
.round-cd{font-family:var(--mono);font-size:10.5px;color:var(--chain);letter-spacing:.03em;white-space:nowrap}
#atlasCanvas{display:block;width:100%;height:auto;cursor:grab;touch-action:pan-x pan-y}
#atlasCanvas.dragging{cursor:grabbing}
#atlasCanvas .dotgrid{ /* svg pattern */ }
.legend-pop{position:absolute;top:10px;right:14px;z-index:20;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;font-size:11.5px;display:none;max-width:280px}
.legend-pop.open{display:block}
.legend-pop h4{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
.legend-pop .row{display:flex;gap:8px;align-items:center;padding:3px 0;color:var(--text-2)}
.legend-pop .row .sw{width:18px;flex:none;display:flex;justify-content:center}
.minimap{position:absolute;right:14px;bottom:12px;width:150px;height:30px;background:rgba(11,14,20,.85);border:1px solid var(--line-2);border-radius:6px;display:none;z-index:15}
@media (max-width:760px){ .minimap{display:block;top:auto;bottom:-38px;right:10px} .atlas-stage{margin-bottom:44px} }
.atlas-stage{position:relative}
.lane-tags{display:none}
.ltag{position:absolute;left:5px;transform:translateY(-50%);font-family:var(--mono);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);background:rgba(11,14,20,.8);border:1px solid var(--line);border-left:2px solid var(--c,#8FB8FF);padding:1px 5px;border-radius:3px;white-space:nowrap;pointer-events:none}
.lane-tags{pointer-events:none}

/* inspector drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);background:var(--panel);border-left:1px solid var(--line-2);z-index:80;transform:translateX(102%);transition:transform .22s ease;overflow-y:auto;padding:18px;box-shadow:-16px 0 40px rgba(0,0,0,.45)}
.drawer.open{transform:none}
.drawer .d-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.drawer .d-head .t{font-family:var(--mono);font-size:12px;word-break:break-all;line-height:1.5}
.drawer .d-x{margin-left:auto;flex:none;width:28px;height:28px;border:1px solid var(--line-2);border-radius:6px;color:var(--text-2);font-size:14px;line-height:1}
.drawer .d-x:hover{color:var(--text);border-color:#3A4557}
.kv{display:grid;grid-template-columns:110px 1fr;gap:5px 12px;font-size:12.5px;margin:10px 0}
.kv .k{color:var(--text-3);font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding-top:2px}
.kv .v{font-family:var(--mono);font-size:11.5px;overflow-wrap:break-word}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line-2);color:var(--text-2);white-space:nowrap}
.chip.alert{color:var(--alert);border-color:#4A2B2B;background:#1B1216}
.chip.ok{color:var(--ok);border-color:#1F3B33;background:#0F1B18}
.chip.virt{color:var(--virt);border-color:#23395C;background:#101A2C}
.chip.chain{color:var(--chain);border-color:#4A3A1F;background:#1A150C}
.d-sec{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.d-sec h5{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
.mini-list{list-style:none}
.mini-list li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12px}
.mini-list li:last-child{border:0}
.mini-list .mono{font-size:11px}
.d-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.d-actions a,.d-actions button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line-2);border-radius:7px;font-size:12px;color:var(--text-2)}
.d-actions a:hover,.d-actions button:hover{color:var(--text);border-color:#3A4557;background:var(--panel-2)}

/* ---------- 3-col band ---------- */
.band{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media (max-width:1100px){.band{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.band{grid-template-columns:minmax(0,1fr)}.panel{min-width:0}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h3{font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:.01em;margin-bottom:2px}
.panel .hint{font-size:11px;color:var(--text-3);margin-bottom:12px}

/* exit outlook ruler */
.ruler{position:relative;height:128px;margin-top:6px}
.ruler .axis{position:absolute;left:0;right:0;top:88px;height:1px;background:var(--line-2)}
.ruler .tick{position:absolute;top:88px;width:1px;height:7px;background:var(--line-2)}
.ruler .tick span{position:absolute;top:99px;left:-16px;width:34px;text-align:center;font-family:var(--mono);font-size:9px;color:var(--text-3)}
.ruler .win{position:absolute;top:50px;height:32px;background:repeating-linear-gradient(45deg,#3A1F22 0 3px,#241419 3px 6px);border:1px solid #5A2E33;border-radius:3px}
.ruler .win2{top:34px;height:9px;background:repeating-linear-gradient(45deg,#2A2416 0 3px,#1A150C 3px 6px);border-color:#4A3A1F}
.ruler .winlab{position:absolute;top:14px;font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;white-space:nowrap}
.ruler .dot{position:absolute;top:88px;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--bg);cursor:pointer}
.ruler .dot:hover{transform:translate(-50%,-50%) scale(1.3)}
.ruler .dot.renew{background:var(--alert)}
.ruler .dot.other{background:var(--virt)}
.ruler .dot.settled{background:var(--ok)}
.renew-list{margin-top:10px;list-style:none}
.renew-list li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:12px}
.renew-list .amt{font-family:var(--mono);font-size:11.5px;margin-left:auto}
.renew-list .when{font-family:var(--mono);font-size:10.5px;color:var(--alert);white-space:nowrap}
.renew-more{padding:6px 0;font-family:var(--mono);font-size:10.5px;color:var(--text-3);border-top:1px dashed var(--line)}
.stat-big{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em;margin:6px 0 2px}
.stat-big small{font-size:13px;color:var(--text-3)}
.fact-hero .big small{font-size:.45em;color:var(--text-3);font-weight:400}

/* operators */
.op-block{padding:12px 0;border-top:1px solid var(--line)}
.op-block:first-of-type{border-top:0;padding-top:0}
.op-name{display:flex;align-items:baseline;gap:8px}
.op-name .nm{font-weight:600;font-size:14px}
.op-name .ver{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.op-name .ep{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-3)}
.lifebar{position:relative;height:26px;margin:10px 0 4px;background:var(--panel-2);border-radius:5px;overflow:hidden}
.lifebar .seg-fill{position:absolute;top:0;bottom:0;background:rgba(143,184,255,.3)}
.lifebar .seg-exit{position:absolute;top:0;bottom:0;background:var(--alert);opacity:.85}
.lifebar .tickmark{position:absolute;top:0;bottom:0;width:1px;background:rgba(230,234,242,.25)}
.lifebar-lab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--text-3);margin-bottom:10px}
.op-params{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:11.5px}
.op-params .pk{color:var(--text-3);font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase}
.op-params .pv{font-family:var(--mono);font-size:11px;text-align:right;overflow-wrap:break-word}
.fee-expr{font-family:var(--mono);font-size:10.5px;color:var(--text-2);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 8px;margin-top:8px;line-height:1.5;overflow-wrap:anywhere}
.next-round{display:flex;align-items:center;gap:8px;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--text-2);flex-wrap:wrap;row-gap:3px}
.next-round .cd{color:var(--chain);font-size:13px}

/* latest list */
.latest{list-style:none}
.latest li{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px;cursor:pointer}
.latest li:last-child{border:0}
.latest li:hover .t{color:var(--virt)}
.latest .glyph{width:16px;flex:none;display:flex;justify-content:center}
.latest .t{font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.latest .amt{font-family:var(--mono);font-size:11px;color:var(--text-2);margin-left:auto;white-space:nowrap}
.latest .when{font-family:var(--mono);font-size:10px;color:var(--text-3);white-space:nowrap}

/* activity table */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.act{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
table.act th{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-2);font-weight:400;white-space:nowrap}
table.act td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.act tr:last-child td{border-bottom:0}
table.act tbody tr{cursor:pointer}
table.act tbody tr:hover{background:var(--panel-2)}
td .tx{font-family:var(--mono);font-size:11.5px}
td .amt{font-family:var(--mono);font-size:11.5px;text-align:right}
td .when{font-family:var(--mono);font-size:10.5px;color:var(--text-3);white-space:nowrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchip{font-family:var(--sans);font-size:11.5px;letter-spacing:.02em;padding:4px 12px;border:1px solid var(--line-2);border-radius:20px;color:var(--text-3)}
.fchip.on{color:var(--text);border-color:var(--virt);background:#16202F}
.showmore{display:block;margin:12px auto 0;height:32px;padding:0 18px;border:1px solid var(--line-2);border-radius:7px;font-size:12.5px;color:var(--text-2)}
.showmore:hover{color:var(--text);border-color:#3A4557}

/* ---------- detail pages ---------- */
.detail{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
@media (max-width:1000px){.detail{grid-template-columns:1fr}}
.facts{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:sticky;top:64px}
@media (max-width:1000px){.facts{position:static}}
.facts h3{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:10px}
.fact-hero{margin-bottom:14px}
.fact-hero .big{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:-.02em}
.fact-hero .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.fact-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line);font-size:12px}
.fact-row .k{color:var(--text-3);font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding-top:2px}
.fact-row .v{font-family:var(--mono);font-size:11.5px;text-align:right;overflow-wrap:break-word;min-width:0}
.fact-row .v .cpbtn{margin-left:4px}
.copybtn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;color:var(--text-3);vertical-align:-4px;margin-left:4px;border:1px solid transparent}
.copybtn:hover{color:var(--text);border-color:var(--line-2);background:var(--panel-2)}
.copybtn.done{color:var(--ok)}
details.raw{margin-top:10px;border:1px solid var(--line);border-radius:6px}
details.raw summary{padding:8px 10px;font-family:var(--mono);font-size:10.5px;color:var(--text-3);cursor:pointer;letter-spacing:.05em;text-transform:uppercase}
details.raw pre{padding:10px;font-family:var(--mono);font-size:10.5px;color:var(--text-2);white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto;border-top:1px solid var(--line)}
.needs-card{border:1px solid #4A2B2B;background:#1B1216;border-radius:8px;padding:12px;margin-top:12px}
.needs-card .ttl{color:var(--alert);font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.needs-card .txt{font-size:12.5px;color:var(--text)}
.needs-card .when{font-family:var(--mono);font-size:11px;color:var(--alert);margin-top:4px}

/* unroll path */
.unroll{margin-top:0}
.path-svg{display:block;width:100%;height:auto}
.gap-cap{cursor:pointer}
.gap-cap:hover .cap-box{stroke:var(--virt)}
.cap-box{fill:#10182B;stroke:var(--cp);stroke-width:1;rx:5}
.cap-txt{fill:var(--text-2);font-family:var(--mono);font-size:9.5px;letter-spacing:.04em}

/* commitment view */
.commit-wrap{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
@media (max-width:1000px){.commit-wrap{grid-template-columns:1fr}}
.ticklist{list-style:none;font-size:12px}
.ticklist li{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.ticklist .mono{font-size:11px;word-break:break-all}
.ticklist .amt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-2);white-space:nowrap}

/* address constellation */
.addr-wrap{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
@media (max-width:1000px){.addr-wrap{grid-template-columns:1fr}}
.const-svg{display:block;width:100%;height:560px}
.vtxo-table{width:100%;border-collapse:collapse;font-size:12px}
.vtxo-table th{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line-2);font-weight:400}
.vtxo-table td{padding:7px 10px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px}
.vtxo-table tr{cursor:pointer}
.vtxo-table tr:hover{background:var(--panel-2)}

/* watchlist drawer */
.watch-drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);background:var(--panel);border-left:1px solid var(--line-2);z-index:80;transform:translateX(102%);transition:transform .22s ease;overflow-y:auto;padding:18px;box-shadow:-16px 0 40px rgba(0,0,0,.45)}
.watch-drawer.open{transform:none}
.watch-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12px}
.watch-item .mono{font-size:11px;word-break:break-all}
.watch-item .when{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--alert);white-space:nowrap}
.watch-x{flex:none;width:24px;height:24px;border:1px solid var(--line-2);border-radius:5px;color:var(--text-3);font-size:12px}

    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><line x1="1" y1="13" x2="17" y2="13" stroke="#F2A93B" stroke-width="1.2"/><rect x="7.4" y="6.4" width="3.2" height="3.2" transform="rotate(45 9 8)" fill="#8FB8FF" stroke="#E6EAF2" stroke-width=".8"/></svg>

<script src="data.js"></script>
<script>
'use strict';
/* ============================================================
   ATLAS — ark.observer proposal 03
   ============================================================ */
const D = window.ARK_OBSERVER_DATA;
const T0 = performance.now();
const now = () => D.meta.generatedAt + (performance.now() - T0) / 1000;
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs={}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const elh = (tag, attrs={}, parent) => { const e = document.createElement(tag); for (const k in attrs){ if(k==='class') e.className=attrs[k]; else if(k==='html') e.innerHTML=attrs[k]; else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); } if(parent) parent.appendChild(e); return e; };

/* ---------------- formatting ---------------- */
const NF = new Intl.NumberFormat('en-US');
const sats = n => n == null ? '—' : NF.format(Math.round(n)) + ' sats';
// human-facing: integers with grouping, always — never "4.9 k sats"
const satsShort = n => n == null ? '—' : NF.format(Math.round(n)) + ' sats';
// compact bare number for tiny SVG labels (no unit)
const satsMini = n => n == null ? '' : NF.format(Math.round(n));
const KIND_LABEL = { payment:'Payment', onboard:'Onboard', refresh:'Refresh', batch:'Commitment', 'server-in':'To server', 'server-out':'From server' };
const kindLabel = k => KIND_LABEL[k] || (k ? k[0].toUpperCase()+k.slice(1) : k);
const btc = n => {
  if (n == null) return '—';
  const v = n / 1e8;
  return v.toFixed(8);
};
const dur = (a, b=now()) => {
  const s = Math.max(0, b - a);
  if (s < 90) return Math.round(s) + ' s';
  if (s < 5400) return Math.round(s/60) + ' min';
  if (s < 172800) return (s/3600).toFixed(s<36000?1:0).replace(/\.0$/,'') + ' h';
  return (s/86400).toFixed(1).replace(/\.0$/,'') + ' d';
};
const durExact = s => {
  s = Math.round(s);
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), sec=s%60;
  if (d) return `${d} d ${h} h`;
  if (h) return `${h} h ${m} min`;
  if (m) return `${m} min ${sec} s`;
  return `${sec} s`;
};
const ago = t => { const d = now() - t; if (d < 60) return 'now'; if (d < 3600) return Math.floor(d/60)+'m ago'; if (d < 86400) return Math.floor(d/3600)+'h ago'; return Math.floor(d/86400)+'d ago'; };
const until = t => { const d = t - now(); if (d < 0) return 'expired'; if (d < 3600) return Math.ceil(d/60)+' min'; if (d < 86400) return (d/3600).toFixed(1).replace(/\.0$/,'')+' h'; return (d/86400).toFixed(1).replace(/\.0$/,'')+' d'; };
const hhmm = t => new Date(t*1000).toISOString().slice(11,16);
const ddmm = t => { const d=new Date(t*1000); return d.toISOString().slice(5,10).replace('-','/'); };
const dthhmm = t => { const d=new Date(t*1000); return d.toISOString().slice(5,16).replace('T',' ')+'Z'; };
const mid = (s,n=10) => s.length<=n*2+1 ? s : s.slice(0,n)+'…'+s.slice(-n);
const short = (s,n=8) => s.length<=n*2+1 ? s : s.slice(0,n)+'…'+s.slice(-n);
const copyBtn = async (text) => {
  try { await navigator.clipboard.writeText(text); } catch(e) {
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
};
const iconCopy = `<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="6" height="6" rx="1" stroke="currentColor"/><path d="M3.5 1V0.5A.5.5 0 0 1 4 0h5a.5.5 0 0 1 .5.5v5a.5.5 0 0 1-.5.5H9" stroke="currentColor"/></svg>`;

/* ---------------- shared lookups ---------------- */
const COMMIT = D.commitmentTxs;
const VTX = D.virtualTxs;
const CHAIN = D.vtxoChains;
const ADDR = D.addresses;
const commitOf = txid => COMMIT[txid] || null;
const vtxTime = id => (VTX[id] && VTX[id].createdAt) || (COMMIT[id] && COMMIT[id].endedAt) || (D.activity.find(a=>a.txid===id)||{}).time || null;
const commitBlock = id => { const c = COMMIT[id]; return c ? c.onchain.blockHeight : null; };
const blockByHeight = new Map(D.chain.blocks.map(b=>[b.height,b]));
const STATE_COLOR = { renew:'#FF6464', expired:'#FF6464', preconfirmed:'#8FB8FF', settled:'#5ED6AE', spent:'#5E6879', refreshed:'#5E6879', swept:'#5E6879', unknown:'#5E6879', confirmed:'#F2A93B', mempool:'#F2A93B' };
const LANE_COLOR = { arkade:'#8FB8FF', second:'#F2A93B' };

/* ---------------- frozen clock ticker ---------------- */
const clockEls = [];
function rel(t){ return ago(t); }
setInterval(() => { for (const f of clockEls) { try { f(); } catch(e){} } }, 1000);

/* ---------------- routing ---------------- */
const routes = { overview: renderOverview, tx: renderTx, commitment: renderCommitment, address: renderAddress, vtxo: renderVtxo };
function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if (!parts.length) return { view:'overview' };
  const [view, ...rest] = parts;
  return { view, id: rest.join('/') ? decodeURIComponent(rest.join('/')) : null };
}
function route(){
  const r = parseHash();
  closeDrawer(); closeWatch();
  const fn = routes[r.view] || routes.overview;
  $('#app').innerHTML = '';
  fn(r.id);
  window.scrollTo(0,0);
}
addEventListener('hashchange', route);
// detail SVGs are width-dependent (desktop flow vs mobile metro) — re-render on resize
let resizeT; addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(route,180);});
// cross-proposal switcher: keep the current route in each link (also for open-in-new-tab)
$$('#swSignal,#swDatasheet,#swAtlas').forEach(a=>{ a.dataset.base=a.getAttribute('href'); });
function syncSwitcher(){
  const h=location.hash && location.hash!=='#/' ? location.hash : '';
  $$('#swSignal,#swDatasheet,#swAtlas').forEach(a=>{ a.href=a.dataset.base+h; });
}
addEventListener('hashchange',syncSwitcher);
syncSwitcher();

/* ============================================================
   HELPERS — svg + html builders
   ============================================================ */
function svgEl(tag, attrs, parent){ return el(tag, attrs, parent); }
function mkSvg(w,h,parent,cls=''){
  const s = svgEl('svg',{viewBox:`0 0 ${w} ${h}`,width:'100%',height:'100%',class:cls, preserveAspectRatio:'xMidYMid meet'},parent);
  s.style.display='block'; return s;
}
function txt(parent,x,y,s,attrs={}){
  const t = svgEl('text',{x,y,'font-size':attrs.fs||10,fill:attrs.fill||'#9AA4B5','font-family':attrs.mono===false?'var(--sans)':'var(--mono)','letter-spacing':attrs.ls||0,'text-anchor':attrs.anchor||'start'},parent);
  t.textContent = s;
  if(attrs.weight) t.setAttribute('font-weight',attrs.weight);
  if(attrs.opacity) t.setAttribute('opacity',attrs.opacity);
  if(attrs.stroke){ t.setAttribute('stroke',attrs.stroke); t.setAttribute('stroke-width',attrs.sw||3); t.setAttribute('paint-order','stroke'); }
  if(attrs.cls) t.setAttribute('class',attrs.cls);
  return t;
}
function line(parent,x1,y1,x2,y2,attrs={}){
  const a={d:`M${x1} ${y1} L${x2} ${y2}`,stroke:attrs.stroke||'#2A3344','stroke-width':attrs.w||1,fill:'none','stroke-dasharray':attrs.dash||'',opacity:attrs.o||1};
  if(attrs.markerEnd)a['marker-end']=attrs.markerEnd;
  if(attrs.markerStart)a['marker-start']=attrs.markerStart;
  return svgEl('path',a,parent);
}
function curve(parent,x1,y1,cx1,cy1,cx2,cy2,x2,y2,attrs={}){
  const a={d:`M${x1} ${y1} C${cx1} ${cy1} ${cx2} ${cy2} ${x2} ${y2}`,stroke:attrs.stroke||'#2A3344','stroke-width':attrs.w||1.2,fill:'none','stroke-dasharray':attrs.dash||'',opacity:attrs.o||1};
  if(attrs.markerEnd)a['marker-end']=attrs.markerEnd;
  return svgEl('path',a,parent);
}
function diamond(parent,x,y,s,attrs={}){
  const g = svgEl('g',{transform:`translate(${x} ${y})`},parent);
  svgEl('path',{d:`M0 ${-s} L${s} 0 L0 ${s} L${-s} 0 Z`,fill:attrs.fill||'#121722',stroke:attrs.stroke||'#F2A93B','stroke-width':attrs.w||1.4},g);
  if(attrs.inner) svgEl('path',{d:`M0 ${-s*.45} L${s*.45} 0 L0 ${s*.45} L${-s*.45} 0 Z`,fill:attrs.inner},g);
  return g;
}
function vtxoCircle(parent,x,y,r,attrs={}){
  const g = svgEl('g',{transform:`translate(${x} ${y})`,class:attrs.cls||''},parent);
  if(attrs.ring!=null){
    // lifetime arc: r = remaining fraction
    const frac = Math.max(0,Math.min(1,attrs.ring));
    const col = attrs.ringColor || (attrs.alert ? '#FF6464' : '#5E6879');
    const circ = 2*Math.PI*r;
    svgEl('circle',{r:r+2.5,fill:'none',stroke:'#1E2532','stroke-width':2},g);
    if(frac>0.005){
      svgEl('circle',{r:r+2.5,fill:'none',stroke:col,'stroke-width':2,'stroke-linecap':'round',
        'stroke-dasharray':`${circ*frac} ${circ*(1-frac)}`,
        transform:`rotate(-90)`},g);
    }
  }
  svgEl('circle',{r:r,fill:attrs.fill||'#121722',stroke:attrs.stroke||'#E6EAF2','stroke-width':attrs.w||1.4,class:'node-ring'},g);
  if(attrs.label) txt(g,0,r+11,attrs.label,{fs:8.5,fill:attrs.labelColor||'#9AA4B5',anchor:'middle'});
  return g;
}
function hitArea(parent,x,y,w,h,attrs={}){
  return svgEl('rect',{x:x-w/2,y:y-h/2,width:w,height:h,fill:'transparent',class:attrs.cls||'',style:'cursor:pointer'},parent);
}

/* tooltip */
const tip = $('#tip');
function showTip(html,x,y){ tip.innerHTML=html; tip.style.display='block'; moveTip(x,y); }
function moveTip(x,y){ const w=tip.offsetWidth,h=tip.offsetHeight; let px=x+14,py=y+14; if(px+w>innerWidth-8)px=x-w-14; if(py+h>innerHeight-8)py=y-h-14; tip.style.left=px+'px'; tip.style.top=py+'px'; }
function hideTip(){ tip.style.display='none'; }
function bindTip(node,html,getXY){
  node.addEventListener('pointerenter',e=>{showTip(html,e.clientX,e.clientY);});
  node.addEventListener('pointermove',e=>moveTip(e.clientX,e.clientY));
  node.addEventListener('pointerleave',hideTip);
}

/* jargon popover helper */
const JARGON = {
  vtxo:'A VTXO is a virtual UTXO — an off-chain coin inside Ark. It only exists in operator state until a commitment transaction anchors it to Bitcoin.',
  checkpoint:'Checkpoint transactions spend VTXOs off-chain so an Ark tx can consume them. Each input on an Ark tx goes through a checkpoint first.',
  commitment:'A commitment transaction anchors a batch of VTXOs into a Bitcoin block. Arkade calls them batches, Second calls them rounds.',
  exitdepth:'Exit depth = how many transactions a holder must broadcast to exit unilaterally: the VTXO\u2019s own tx plus every off-chain hop back to the commitment, minus the commitment itself.',
  preconfirmed:'Preconfirmed means the operator cosigned the transaction off-chain but it is not yet anchored in a Bitcoin block.',
  exitwindow:'The exit window is the last stretch of a VTXO\u2019s life (≈7 d for Arkade, ≈1 d for Second) where unilateral exit becomes possible before expiry.',
  renew:'Renew means the VTXO is inside the exit window — it must be refreshed into a new batch before it expires or it can be swept.',
  tree:'A batch\u2019s outputs form a merkle tree; each leaf is a VTXO transaction. On mainnet most trees are a single leaf.',
  connector:'Connectors link forfeited VTXO outputs back into the batch so old state can\u2019t be spent twice.',
  forfeit:'Forfeit transactions let the operator claim a VTXO\u2019s value if its owner lets it expire inside the exit window.',
  anchor:'The anchor output is a tiny OP_RETURN-style marker that ties an Ark transaction to its eventual commitment.',
  batch:'A batch is Arkade\u2019s commitment transaction — it settles many virtual transactions into one on-chain tx.',
  round:'A round is Second\u2019s commitment — an hourly cycle that anchors VTXOs to Bitcoin.',
  serveraddr:'Second publishes a server address; on-chain transactions touching it are its observable footprint. Second has no public VTXO index.',
};
function jargon(term, key){
  const w = elh('span',{class:'jarg'});
  elh('button',{html:esc(term),'aria-label':'About '+term},w).addEventListener('click',e=>{
    e.stopPropagation();
    const p = w.querySelector('.pop');
    const open = !p.classList.contains('open');
    $$('.pop.open').forEach(x=>x.classList.remove('open'));
    if(open){ p.classList.add('open'); }
  });
  elh('span',{class:'pop',html:`<div class="jt">${esc(term)}</div>${esc(JARGON[key]||'')}`},w);
  return w;
}

/* state chip */
function chip(state, extra=''){
  const cls = state==='renew'||state==='expired' ? 'alert' : (state==='settled'||state==='confirmed') ? 'ok' : (state==='preconfirmed') ? 'virt' : 'chain';
  return `<span class="chip ${cls} ${extra}">${esc(state)}</span>`;
}
function glyphFor(a){
  // returns svg glyph html for activity row / latest
  if(a.network==='second'){
    return `<svg width="14" height="14" viewBox="0 0 14 14"><rect x="2" y="2" width="10" height="10" transform="rotate(45 7 7)" fill="none" stroke="#F2A93B" stroke-width="1.3"/></svg>`;
  }
  if(a.layer==='onchain'){
    return `<svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1.5 L12.5 7 L7 12.5 L1.5 7 Z" fill="none" stroke="#F2A93B" stroke-width="1.3"/></svg>`;
  }
  if(a.kind==='onboard'||a.kind==='refresh'){
    return `<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="4" fill="none" stroke="#8FB8FF" stroke-width="1.3"/><circle cx="7" cy="7" r="1.4" fill="#8FB8FF"/></svg>`;
  }
  return `<svg width="14" height="14" viewBox="0 0 14 14"><rect x="1.5" y="3.5" width="11" height="7" rx="3.5" fill="none" stroke="#8FB8FF" stroke-width="1.3"/></svg>`;
}

/* watchlist */
const WL_KEY = 'ark-observer-proto-atlas-watchlist';
function wlLoad(){ try{return JSON.parse(localStorage.getItem(WL_KEY))||{}}catch(e){return{}} }
function wlSave(w){ localStorage.setItem(WL_KEY, JSON.stringify(w)); }
const watch = wlLoad();
function wlKey(kind,id){ return kind+':'+id; }
function isWatched(kind,id){ return !!watch[wlKey(kind,id)]; }
function toggleWatch(kind,id,label){
  const k=wlKey(kind,id);
  if(watch[k]) delete watch[k]; else watch[k]={kind,id,label:label||id,time:now()};
  wlSave(watch); renderWatchBadge(); if($('#watchDrawer').classList.contains('open')) renderWatchDrawer();
}
function renderWatchBadge(){ $('#watchCount').textContent = Object.keys(watch).length; }
function watchBtnHTML(kind,id,label){
  const on = isWatched(kind,id);
  return `<button class="watchbtn ${on?'on':''}" data-watch="${esc(kind)}:${esc(id)}" data-label="${esc(label||'')}" aria-pressed="${on}"><span class="star" aria-hidden="true">${on?'★':'☆'}</span>${on?'Watching':'Watch'}</button>`;
}

/* copy button */
function copyBtnFor(text){
  const b = elh('button',{class:'copybtn','aria-label':'Copy','title':'Copy','html':iconCopy});
  b.addEventListener('click',async e=>{e.stopPropagation();await copyBtn(text);b.classList.add('done');b.innerHTML='✓';setTimeout(()=>{b.classList.remove('done');b.innerHTML=iconCopy;},1200);});
  return b;
}

/* inspector drawer */
const inspector = $('#inspector');
function openInspector(html){ inspector.innerHTML=html; inspector.classList.add('open'); }
function closeDrawer(){ inspector.classList.remove('open'); }
$('#inspector .d-x')?.remove; // x handled per-render
addEventListener('keydown',e=>{ if(e.key==='Escape'){closeDrawer();closeWatch();$$('.pop.open').forEach(x=>x.classList.remove('open'));$('#suggest').innerHTML='';} });

/* watch drawer */
const watchDrawer = $('#watchDrawer');
function openWatch(){ renderWatchDrawer(); watchDrawer.classList.add('open'); }
function closeWatch(){ watchDrawer.classList.remove('open'); }
$('#watchBtn').addEventListener('click',()=> watchDrawer.classList.contains('open')?closeWatch():openWatch());
function renderWatchDrawer(){
  const items = Object.entries(watch);
  let h = `<div class="d-head"><div class="t" style="font-family:var(--sans);font-size:14px;font-weight:600">Watchlist</div><button class="d-x" id="wdx" aria-label="Close">✕</button></div>`;
  if(!items.length){ h += `<div class="watch-empty">Nothing watched yet.<br>Watch an address or VTXO from its page.</div>`; }
  else {
    h += `<div class="hint" style="font-size:11.5px;color:var(--text-3);margin-bottom:8px">Nearest expiry across watched items:</div>`;
    let nearest=null;
    for(const [k,v] of items){
      const exp = nearestExpiryFor(v.kind,v.id);
      if(exp!=null && (nearest==null||exp<nearest)) nearest=exp;
    }
    if(nearest!=null) h += `<div class="stat-big" style="font-size:20px">${until(nearest)} <small>until nearest expiry</small></div>`;
    for(const [k,v] of items){
      const exp = nearestExpiryFor(v.kind,v.id);
      const href = v.kind==='address' ? '#/address/'+encodeURIComponent(v.id) : '#/vtxo/'+encodeURIComponent(v.id);
      h += `<div class="watch-item"><div><a href="${href}" class="mono" style="color:var(--virt)">${esc(short(v.id,12))}</a><div class="micro" style="color:var(--text-3)">${esc(v.kind)}${v.label?' · '+esc(v.label.slice(0,14)):''}</div></div><span class="when">${exp!=null?until(exp):'—'}</span><button class="watch-x" data-unwatch="${esc(k)}" aria-label="Remove">✕</button></div>`;
    }
  }
  h += `<div class="hint" style="margin-top:14px;font-size:11px;color:var(--text-3)">Stored locally in this browser only.</div>`;
  watchDrawer.innerHTML=h;
  $('#wdx')?.addEventListener('click',closeWatch);
  $$('[data-unwatch]',watchDrawer).forEach(b=>b.addEventListener('click',()=>{const[k]=b.dataset.unwatch.split(/:(.+)/).length>1?[b.dataset.unwatch]:[]; /* simpler */ }));
  // simpler unwatch handler
  watchDrawer.querySelectorAll('.watch-x').forEach((b,i)=>{
    b.onclick=()=>{ const key=Object.keys(watch)[i]; delete watch[key]; wlSave(watch); renderWatchBadge(); renderWatchDrawer(); };
  });
}
function nearestExpiryFor(kind,id){
  if(kind==='address'){ const a=ADDR[id]; if(!a) return null; return a.vtxos.reduce((m,v)=>v.expiresAt&&(m==null||v.expiresAt<m)?v.expiresAt:m,null); }
  if(kind==='vtxo'){ const c=CHAIN[id]; if(!c) return null; const [txid]=id.split(':'); const t=VTX[txid]; return t?t.expiresAt:null; }
  return null;
}
renderWatchBadge();

/* ---------- atlas canvas ---------- */
function buildAtlas(){
  const svg = $('#atlasCanvas');
  svg.innerHTML='';
  // layout: fixed left gutter for lane labels, plot area shares ONE time axis
  const W=1240, GUT=150, padR=18;
  const plotL=GUT+12, plotR=W-padR, iw=plotR-plotL;
  const laneArkY=98, laneCommitY=184, laneSecY=262, railY=340;
  const H=railY+40;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  const defs=svgEl('defs',{},svg);
  const pat=svgEl('pattern',{id:'dots',width:24,height:24,patternUnits:'userSpaceOnUse'},defs);
  svgEl('circle',{cx:1.2,cy:1.2,r:1,fill:'#161C28'},pat);
  const mkMarker=(id,col)=>{const m=svgEl('marker',{id,viewBox:'0 0 8 8',refX:7,refY:4,markerWidth:6.5,markerHeight:6.5,orient:'auto-start-reverse'},defs);svgEl('path',{d:'M0 0 L8 4 L0 8 Z',fill:col},m);};
  mkMarker('arrB','#8FB8FF'); mkMarker('arrG','#F2A93B');
  svgEl('rect',{x:0,y:0,width:W,height:H,fill:'url(#dots)'},svg);
  atlasG=svgEl('g',{},svg);
  atlasSvg={svg,W,H,padL:plotL,padR,padT:22,padB:0,iw,unitW:0};
  // hover-highlight registry: {el, rels:Set, op}
  const HL=[];
  const reg=(node,rels,op)=>HL.push({el:node,rels:new Set(rels),op});
  atlasHL=HL;

  const t1=now();
  const tEnd = t1 - atlasPanSec;
  const tStart = tEnd - atlasState.win;
  const X = t => plotL + (t-tStart)/atlasState.win*iw;
  const unitW = iw/atlasState.win;
  atlasSvg.unitW=unitW;

  // ---- data in window ----
  const vtxs=Object.values(VTX).filter(t=>t.createdAt>=tStart&&t.createdAt<=tEnd&&atlasState.lane!=='second');
  const acts=D.activity.filter(a=>a.time>=tStart&&a.time<=tEnd);
  const secActs=acts.filter(a=>a.network==='second'&&atlasState.lane!=='arkade');
  const commits=Object.values(COMMIT).filter(c=>c.endedAt>=tStart&&c.endedAt<=tEnd&&atlasState.lane!=='second');

  // height->time map + median interval (for blocks outside the sampled 180)
  const heightTime=new Map(D.chain.blocks.map(b=>[b.height,b.time]));
  const intervals=[];for(let i=1;i<D.chain.blocks.length;i++)intervals.push(D.chain.blocks[i-1].time-D.chain.blocks[i].time);
  intervals.sort((a,b)=>a-b);const medInt=intervals[Math.floor(intervals.length/2)]||600;
  const nearestCache=[...heightTime.entries()];
  function timeForHeight(h){
    if(heightTime.has(h))return heightTime.get(h);
    let nh=null,nd=1e9,nt=0;
    for(const [hh,tt] of nearestCache){const d=Math.abs(hh-h);if(d<nd){nd=d;nh=hh;nt=tt;}}
    if(nh==null)return null;
    return nt+(h-nh)*medInt;
  }
  // anchor position per commitment (shared x for diamond, stem, rail tick)
  const anchorOf=c=>timeForHeight(c.onchain.blockHeight)??c.endedAt;

  // ---- lane labels in the fixed gutter ----
  function glabel(main,sub,y,color){
    txt(atlasG,GUT-14,y,main,{fs:10,fill:color,anchor:'end',weight:600,cls:'gutter-lbl'});
    if(sub)txt(atlasG,GUT-14,y+11,sub,{fs:8,fill:'#6B7686',anchor:'end',cls:'gutter-lbl'});
  }
  txt(atlasG,GUT-14,laneArkY-24,'ARKADE',{fs:10,fill:'#8FB8FF',anchor:'end',weight:600,cls:'gutter-lbl'});
  txt(atlasG,GUT-14,laneArkY-13,'virtual txs',{fs:8,fill:'#6B7686',anchor:'end',cls:'gutter-lbl'});
  glabel('COMMITMENTS','anchored to blocks',laneCommitY-14,'#F2A93B');
  glabel('SECOND','server wallet',laneSecY-14,'#F2A93B');
  glabel('BITCOIN','block rail',railY-14,'#F2A93B');

  // ---- time axis (top) ----
  const tickCount=atlasState.win<=21600?12:atlasState.win<=86400?24:28;
  for(let i=0;i<=tickCount;i++){
    const t=tStart+atlasState.win*i/tickCount;
    const x=X(t);
    if(x<plotL-2||x>plotR+2)continue;
    line(atlasG,x,15,x,21,{stroke:'#2A3344'});
    if(x>plotR-30)continue; // leave the now-edge clear
    const d=new Date(t*1000);
    const label=atlasState.win<=21600?hhmm(t):atlasState.win<=86400?d.toISOString().slice(11,16):ddmm(t);
    txt(atlasG,x,10,label,{fs:8.5,fill:'#5E6879',anchor:'middle'});
  }

  // ---- hourly density band — step AREA on the arkade lane baseline ----
  // fill only (no stroke, ~11% opacity); each contiguous run of active hours is
 // its own subpath so gaps in the archive stay gaps. Nodes draw on top.
  {
    const hours=D.stats.arkadeHourly;
    const maxH=Math.max(...hours.map(h=>h.virtualTxCount),1);
    const bandBase=laneArkY+58, bandH=22;
    let d='',open=false,pendX=0,lastStart=-1e18;
    for(const h of hours){
      const x0=Math.max(X(h.hourStart),plotL), x1=Math.min(X(h.hourStart+3600),plotR);
      if(x1<=x0) continue;
      const contiguous=open&&h.hourStart-lastStart<=3600+1;
      if(h.virtualTxCount<=0||!contiguous){ if(open){d+=` L${pendX} ${bandBase} Z`;open=false;} }
      if(h.virtualTxCount<=0) continue;
      const yt=bandBase-(h.virtualTxCount/maxH)*bandH;
      if(!open){ d+=`M${x0} ${bandBase} L${x0} ${yt}`; open=true; }
      else d+=` L${x0} ${yt}`;   // vertical step at the hour boundary
      d+=` L${x1} ${yt}`;
      pendX=x1; lastStart=h.hourStart;
    }
    if(open) d+=` L${pendX} ${bandBase} Z`;
    if(d){
      const bpEl=svgEl('path',{d,fill:'#8FB8FF',opacity:.11},atlasG); reg(bpEl,[],.11);
      txt(atlasG,GUT-14,bandBase-11,'hourly count · archive',{fs:7.5,fill:'#5E6879',anchor:'end',cls:'gutter-lbl'});
    }
  }

  // ---- block rail — SAME time axis as the lanes ----
  const blocksInWin=D.chain.blocks.filter(b=>b.time>=tStart&&b.time<=tEnd).sort((a,b)=>a.time-b.time);
  const heightsInWin=new Set(blocksInWin.map(b=>b.height));
  const railItems=[];
  for(const b of blocksInWin)railItems.push({h:b.height,t:b.time,known:true,pool:b.pool,txCount:b.txCount,hash:b.hash,medianFee:b.medianFee,size:b.size});
  const commitAnchor=new Map(); // txid -> anchor time (shared x for diamond/stem/tick)
  for(const c of commits){
    const h=c.onchain.blockHeight;
    if(!heightsInWin.has(h)){
      const at=anchorOf(c);
      if(at!=null&&at>=tStart&&at<=tEnd)railItems.push({h,t:at,known:false,pool:null,commit:c.txid});
    }
    const at2=anchorOf(c); if(at2!=null)commitAnchor.set(c.txid,at2);
  }
  // second txs' blocks get rail ticks too (interpolated when outside the 180-block sample)
  for(const a of secActs){
    if(!a.blockHeight||heightsInWin.has(a.blockHeight))continue;
    const bt=timeForHeight(a.blockHeight);
    if(bt!=null&&bt>=tStart&&bt<=tEnd)railItems.push({h:a.blockHeight,t:bt,known:false,pool:null,second:a.txid});
  }
  railItems.sort((a,b)=>a.t-b.t);
  const seenH=new Set();
  const rail=railItems.filter(r=>{if(seenH.has(r.h))return false;seenH.add(r.h);return true;});
  const commitHeights=new Map();
  for(const c of commits){const h=c.onchain.blockHeight;if(!commitHeights.has(h))commitHeights.set(h,[]);commitHeights.get(h).push(c.txid);}

  // draw rail ticks; width = min(gap-1, 10px)
  let lastLabelX=-1e9;
  for(let i=0;i<rail.length;i++){
    const r=rail[i];
    const x=X(r.t);
    if(x<plotL-3||x>plotR+3)continue;
    const nextX=i<rail.length-1?X(rail[i+1].t):plotR+4;
    const w=Math.max(1,Math.min(nextX-x-1,10));
    const ch=commitHeights.get(r.h);
    const rels=['blk:'+r.h]; if(ch)rels.push('cm:'+ch[0]); if(r.second)rels.push('sec:'+r.second);
    const g=svgEl('g',{transform:`translate(${x} ${railY})`,style:'cursor:pointer'},atlasG);
    if(r.known){
      svgEl('rect',{x:-w/2,y:-4.5,width:w,height:9,rx:1,fill:'#161C28',stroke:ch?'#4A3A1F':'#2A3344','stroke-width':1},g);
      if(ch)svgEl('rect',{x:-w/2,y:-6.5,width:w,height:2.5,fill:'#F2A93B',rx:1},g);
    }else if(r.second){
      // second tx's block — hollow amber tick
      svgEl('rect',{x:4.5,y:-3.5,width:3,height:7,fill:'#10182B',stroke:'#F2A93B','stroke-width':.9},g);
    }else{
      // interpolated commitment height — slim gold tick
      svgEl('rect',{x:-1.5,y:-5,width:3,height:10,fill:'#1A150C',stroke:'#F2A93B','stroke-width':.8},g);
    }
    reg(g,rels,1);
    g.addEventListener('pointerenter',()=>setAtlasHover(rels));
    g.addEventListener('pointerleave',()=>setAtlasHover(null));
    const bt=r.t?dthhmm(r.t):'—';
    if(ch){
      bindTip(g,`<div class="tt">block ${r.h}</div><div class="tx">${ch.map(mid).join('<br>')}</div>`,e=>[e.clientX,e.clientY]);
      g.addEventListener('click',()=>{if(ch[0])location.hash='#/commitment/'+ch[0];});
    }else{
      bindTip(g,`<div class="tt">block ${r.h}</div><div style="margin-top:4px">${bt} UTC${r.known?'':' · <span style="color:var(--chain)">interpolated</span>'}</div>`,e=>[e.clientX,e.clientY]);
      g.addEventListener('click',()=>{
        openInspector(`<div class="d-head"><div class="t">block ${r.h}</div></div>
          <div class="kv"><span class="k">time</span><span class="v">${bt} UTC</span>
          ${r.known?`
          <span class="k">pool</span><span class="v">${esc(r.pool||'—')}</span>
          <span class="k">txs</span><span class="v">${(r.txCount||0).toLocaleString()}</span>
          <span class="k">median fee</span><span class="v">${r.medianFee!=null?r.medianFee+' sat/vB':'—'}</span>
          <span class="k">size</span><span class="v">${r.size?Math.round(r.size/1e6*10)/10+' MB':'—'}</span>`:`
          <span class="k">status</span><span class="v">interpolated height (outside sampled blocks)</span>`}
          <span class="k">commitments</span><span class="v">none observed</span>
          ${r.second?`<span class="k">second tx</span><span class="v"><a href="https://mempool.space/tx/${r.second}" target="_blank" rel="noopener" style="color:var(--virt)">${mid(r.second,12)} ↗</a></span>`:''}</div>
          ${r.known&&r.hash?`<div class="d-actions"><a href="https://mempool.space/block/${r.hash}" target="_blank" rel="noopener">mempool.space ↗</a></div>`:''}`);
      });
    }
    // height label: space by actual x so labels never collide; skip anything
    // crowding the now-edge on the right
    const labelW=atlasState.win<=21600?30:atlasState.win<=86400?38:30;
    const isLast=i===rail.length-1;
    if(x<plotR-24&&(x-lastLabelX>=labelW||(isLast&&x-lastLabelX>=labelW*0.55))){
      txt(atlasG,x,railY+17,String(r.h),{fs:7.2,fill:'#5E6879',anchor:'middle'});
      lastLabelX=x;
    }
  }
  txt(atlasG,plotL+6,railY+30,'block height →',{fs:8,fill:'#5E6879',anchor:'start'});
  // ---- commitments ◆ — placed at their block's x → stems are vertical ----
  const commitPos=new Map(); // txid -> {x,y}
  for(const c of commits){
    const at=commitAnchor.get(c.txid)??anchorOf(c);
    const x=X(at);
    if(x<plotL-24||x>plotR+24)continue;
    const cy=laneCommitY;
    const rels=['cm:'+c.txid,'blk:'+c.onchain.blockHeight];
    // vertical stem down to the rail
    const stem=line(atlasG,x,cy+10,x,railY-6,{stroke:'#F2A93B',w:1,o:.5});
    reg(stem,rels,.5);
    const dg=diamond(atlasG,x,cy,6.5,{stroke:'#F2A93B',fill:'#1A150C'});
    commitPos.set(c.txid,{x,y:cy});
    reg(dg,rels,1);
    dg.style.cursor='pointer';
    dg.addEventListener('pointerenter',()=>setAtlasHover(rels));
    dg.addEventListener('pointerleave',()=>setAtlasHover(null));
    const vtxoN=c.totalInputVtxos||c.batches.reduce((s,b)=>s+b.vtxoCount,0)||0;
    bindTip(dg,`<div class="tt">commitment · batch</div><div class="tx">${mid(c.txid)}</div><div style="margin-top:4px;color:var(--text-2)">${vtxoN} VTXO${vtxoN===1?'':'s'} · block ${c.onchain.blockHeight} · ${ago(c.endedAt)}</div>`,e=>[e.clientX,e.clientY]);
    dg.addEventListener('click',()=>location.hash='#/commitment/'+c.txid);
  }

  // ---- arkade virtual txs — node size ∝ √amount ----
  const maxOut=Math.max(1,...vtxs.map(t=>t.totalOut||t.totalIn||1));
  const arkEvents=[];
  for(const t of vtxs){
    const x=X(t.createdAt);
    const amt=t.totalOut||t.totalIn||0;
    const r=Math.max(4,Math.min(11,4+7*Math.sqrt(amt/maxOut)));
    const g=svgEl('g',{transform:`translate(${x} ${laneArkY})`,style:'cursor:pointer'},atlasG);
    if(t.kind==='payment'){
      svgEl('rect',{x:-r*1.45,y:-r,width:r*2.9,height:r*2,rx:r,fill:'#10182B',stroke:'#8FB8FF','stroke-width':1.3},g);
    }else{
      svgEl('circle',{r:r,fill:'#10182B',stroke:'#8FB8FF','stroke-width':1.3},g);
      svgEl('circle',{r:Math.max(1.2,r*.3),fill:'#8FB8FF'},g);
    }
    if(t.state==='settled')svgEl('circle',{r:r+3.2,fill:'none',stroke:'#5ED6AE','stroke-width':1,'stroke-dasharray':'2 2',opacity:.7},g);
    if(t.state==='renew')svgEl('circle',{r:r+3.2,fill:'none',stroke:'#FF6464','stroke-width':1.1},g);
    const cid=(t.commitmentTxids||[])[0]||null;
    const rels=['tx:'+t.txid]; if(cid)rels.push('cm:'+cid);
    reg(g,rels,1);
    g.addEventListener('pointerenter',()=>setAtlasHover(rels));
    g.addEventListener('pointerleave',()=>setAtlasHover(null));
    bindTip(g,`<div class="tt">ark tx · ${esc(t.kind)}</div><div class="tx">${mid(t.txid)}</div><div style="margin-top:4px">${chip(t.state)} ${sats(t.totalOut)} · ${ago(t.createdAt)}</div>`,e=>[e.clientX,e.clientY]);
    g.addEventListener('click',()=>location.hash='#/tx/'+t.txid);
    arkEvents.push({x,g,t,r,y:laneArkY,cid});
  }
  // collision nudging within the arkade lane
  arkEvents.sort((a,b)=>a.x-b.x);
  const minGapPx=atlasState.win<=21600?30:atlasState.win<=86400?22:14;
  let lastX=-1e9,stack=0;
  for(const ev of arkEvents){
    if(ev.x-lastX<minGapPx){stack=Math.min(stack+1,3);ev.y=laneArkY+stack*15;}
    else{stack=0;ev.y=laneArkY;}
    ev.g.setAttribute('transform',`translate(${ev.x} ${ev.y})`);
    lastX=ev.x;
  }
  // threads: full curve only when the commitment diamond is on-canvas;
  // otherwise a short stub toward the anchor side with an arrow + label.
  // Labels are shortened (<9d / 9d>) and alternate above/below the node to avoid piles.
  let stubRow=0;
  const stubLabels=[];
  for(const ev of arkEvents){
    const t=ev.t,cid=ev.cid;
    if(!cid)continue;
    const rels=['tx:'+t.txid,'cm:'+cid];
    const cp=commitPos.get(cid);
    const y0=ev.y+ev.r+2;
    if(cp){
      const p=curve(atlasG,ev.x,y0,cp.x-14,(y0+cp.y)/2,cp.x-8,cp.y+10,cp.x,cp.y+9,{stroke:'#8FB8FF',w:1,o:.55,dash:'3 3'});
      reg(p,rels,.55);
    }else{
      const c=COMMIT[cid];
      if(!c)continue;
      const at=commitAnchor.get(cid)??anchorOf(c);
      const ax=X(at);
      const inWin=ax>=plotL&&ax<=plotR;
      const dir = !inWin ? (ax<plotL?-1:1) : (ax<ev.x?-1:1);
      const stubLen=30;
      const x1=ev.x+dir*(ev.r+4), x2=ev.x+dir*(ev.r+4+stubLen);
      const p=line(atlasG,x1,ev.y,x2,ev.y,{stroke:'#8FB8FF',w:1,o:.7,'marker-end':'url(#arrB)'});
      reg(p,rels,.7);
      const dd=Math.max(1,Math.round(Math.abs(at-(inWin?t.createdAt:tEnd))/86400));
      stubLabels.push({lx:(x1+x2)/2, dir, inWin, dd, rels, evY:ev.y});
    }
  }
  // draw stub labels in two staggered rows; de-collide by skipping a label whose
  // x is within 26px of an already-placed label on the same row
  const rowX=[[],[]];
  for(const s of stubLabels){
    const pref=(stubRow++)%2;
    // two FIXED rows clear of the node stack: above the lane and in the gap
    // before the commitment diamonds; de-collide per row by x
    const fits=rr=>!rowX[rr].some(px=>Math.abs(px-s.lx)<32);
    let r2=pref;
    if(!fits(r2)) r2=1-r2;
    if(!fits(r2)) continue; // extremely dense — tooltip on the stub still explains
    rowX[r2].push(s.lx);
    const y=r2===0?laneArkY-21:laneCommitY-16;
    const lbl=s.inWin?'in win':(s.dir<0?'<'+s.dd+'d':s.dd+'d>');
    const tx=txt(atlasG,s.lx,y,lbl,{fs:7,fill:'#5E6879',stroke:'#0B0E14',sw:3.5});
    reg(tx,s.rels,.8);
  }

  // ---- second lane — nodes sit at their block's x → stems are vertical ----
  const secEvents=[];
  for(const a of secActs){
    const bx = a.blockHeight? X(timeForHeight(a.blockHeight)??a.time) : X(a.time);
    const g=svgEl('g',{transform:`translate(${bx} ${laneSecY})`,style:'cursor:pointer'},atlasG);
    diamond(g,0,0,5,{stroke:'#F2A93B',fill:'#1A150C'});
    const rels=['sec:'+a.txid]; if(a.blockHeight)rels.push('blk:'+a.blockHeight);
    reg(g,rels,1);
    g.addEventListener('pointerenter',()=>setAtlasHover(rels));
    g.addEventListener('pointerleave',()=>setAtlasHover(null));
    if(a.blockHeight){
      // +6px offset so second stems don't merge with commitment stems on the same block
      const stem=line(atlasG,bx+6,laneSecY+8,bx+6,railY-6,{stroke:'#F2A93B',w:.8,o:.4});
      reg(stem,rels,.4);
    }
    bindTip(g,`<div class="tt">second · ${esc(a.kind)}</div><div class="tx">${mid(a.txid)}</div><div style="margin-top:4px">${chip(a.state)} ${sats(a.amount)} · block ${a.blockHeight||'—'} · ${ago(a.time)}</div>`,e=>[e.clientX,e.clientY]);
    g.addEventListener('click',()=>{
      openInspector(`<div class="d-head"><div class="t">${mid(a.txid)}</div></div>
        <div class="kv"><span class="k">lane</span><span class="v">second · server wallet</span>
        <span class="k">kind</span><span class="v">${esc(kindLabel(a.kind))}</span>
        <span class="k">state</span><span class="v">${chip(a.state)}</span>
        <span class="k">amount</span><span class="v">${sats(a.amount)}</span>
        <span class="k">block</span><span class="v">${a.blockHeight||'—'}</span>
        <span class="k">time</span><span class="v">${dthhmm(a.time)} · ${ago(a.time)}</span></div>
        <div class="d-sec"><h5>Note</h5><p style="font-size:12px;color:var(--text-2)">Second publishes no VTXO index — this is an on-chain transaction touching its server address, observed via Esplora.</p></div>
        <div class="d-actions"><a href="https://mempool.space/tx/${a.txid}" target="_blank" rel="noopener">mempool.space ↗</a></div>`);
    });
    secEvents.push({x:bx,g,a});
  }
  secEvents.sort((a,b)=>a.x-b.x);
  let sLast=-1e9,sStack=0;
  for(const ev of secEvents){
    if(ev.x-sLast<24){sStack=Math.min(sStack+1,2);ev.g.setAttribute('transform',`translate(${ev.x} ${laneSecY+sStack*14})`);}
    else{sStack=0;ev.g.setAttribute('transform',`translate(${ev.x} ${laneSecY})`);}
    sLast=ev.x;
  }

  // ---- now edge + next-round ghost (inside the window only) ----
  const nx=X(tEnd);
  const nowG=svgEl('g',{transform:`translate(${nx} 0)`},atlasG);
  svgEl('line',{x1:0,y1:18,x2:0,y2:H-4,stroke:'#E6EAF2','stroke-width':1,'stroke-dasharray':'2 4',opacity:.5},nowG);
  svgEl('circle',{cx:0,cy:railY,r:3.5,fill:'#E6EAF2'},nowG);
  const nr=D.operators.second.nextRoundAt;
  let nrt=nr;
  if(nrt<=now()) nrt = nr + Math.max(1,Math.ceil((now()-nr)/D.operators.second.roundIntervalSec))*D.operators.second.roundIntervalSec;
  if(nrt>tStart&&nrt<tEnd){
    const gx=X(nrt);
    const gg=svgEl('g',{transform:`translate(${gx} ${laneSecY})`,opacity:.5},atlasG);
    diamond(gg,0,0,6,{stroke:'#F2A93B',fill:'none',w:1});
    txt(gg,0,14,'next',{fs:7,fill:'#F2A93B',anchor:'middle'});
  }
  // countdown lives in the canvas header — clear of the now line
  const cdEl=$('#roundCd');
  if(cdEl){
    const updateCd=()=>{const left=D.operators.second.nextRoundAt-now();cdEl.textContent=left>0?'next round in '+durExact(left):'next round due';};
    updateCd();clockEls.push(updateCd);
  }

  buildMinimap(svg,W,H,plotL,iw);
  $('#canvasMeta').textContent=`${ddmm(tStart)} → ${ddmm(tEnd)} · ${rail.length} rail ticks · ${vtxs.length} ark txs · ${secActs.length} second txs`;
  // on narrow screens the canvas scrolls horizontally — start at the newest edge
  if(innerWidth<760){ const sc=svg.closest('.atlas-scroll'); if(sc) requestAnimationFrame(()=>{sc.scrollLeft=sc.scrollWidth;}); }
}
let atlasHL=null;
let atlasHoverKeys=null;
function setAtlasHover(keys){
  atlasHoverKeys=keys?new Set(keys):null;
  if(!atlasHL)return;
  const act=atlasHoverKeys;
  for(const h of atlasHL){
    const m=act&&h.rels.size&&[...h.rels].some(r=>act.has(r));
    h.el.style.opacity = act ? (m?Math.min(1,h.op*1.6):h.op*0.28) : '';
  }
}
let atlasPanSec=0;
Object.defineProperty(atlasState,'panSec',{get:()=>atlasPanSec,set:v=>{atlasPanSec=v;}});
function bindAtlasPan(){
  const svg=$('#atlasCanvas');
  let dragging=false,sx=0,sp=0,moved=false;
  svg.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse')return; dragging=true;moved=false;sx=e.clientX;sp=atlasPanSec;svg.classList.add('dragging');svg.setPointerCapture(e.pointerId);});
  svg.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const dx=e.clientX-sx;
    if(Math.abs(dx)>3)moved=true;
    if(!moved)return;
    // px -> seconds: unitW px per second
    const unitW=atlasSvg.unitW||1;
    atlasPanSec=sp - dx/unitW;
    // clamp pan: can't go before data start - win, can't go past now
    const minPan = -(atlasState.win - 3600); // allow some left
    const maxPan = 0;
    atlasPanSec=Math.max(minPan,Math.min(maxPan,atlasPanSec));
    buildAtlas();
  });
  const end=()=>{dragging=false;svg.classList.remove('dragging');};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
  svg.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false;}});
}
function buildMinimap(svg,W,H,padL,iw){
  const mm=$('#mmSvg'); if(!mm)return; mm.innerHTML='';
  const mw=150,mh=34;
  // draw tiny density: all activity in last 7d as bars
  const t1=now(),t0=t1-7*86400;
  const bins=60, bw=mw/bins;
  const counts=new Array(bins).fill(0);
  for(const a of D.activity){ if(a.time<t0)continue; const i=Math.floor((a.time-t0)/(7*86400)*bins); if(i>=0&&i<bins)counts[i]++; }
  const max=Math.max(...counts,1);
  for(let i=0;i<bins;i++){
    const h=(counts[i]/max)*(mh-6);
    svgEl('rect',{x:i*bw,y:mh-3-h,width:Math.max(1,bw-1),height:h,fill:'#8FB8FF',opacity:.5},mm);
  }
  // viewport indicator
  const tStart=t1-atlasState.win-atlasPanSec, tEnd=t1-atlasPanSec;
  const vx0=(tStart-t0)/(7*86400)*mw, vx1=(tEnd-t0)/(7*86400)*mw;
  svgEl('rect',{x:Math.max(0,vx0),y:2,width:Math.max(4,vx1-vx0),height:mh-5,fill:'none',stroke:'#E6EAF2','stroke-width':1,opacity:.7},mm);
}

/* ---------- exit outlook ruler ---------- */
function buildRuler(){
  const box=$('#ruler'); box.innerHTML='';
  const W=box.clientWidth||600;
  const days=31;
  // map "days until expiry" onto the plot width with small side insets for edge dots
  const pad=14;
  const X=d=>pad+d/days*(W-pad*2);
  const axisY=88;
  // axis + ticks (labels BELOW axis, window labels ABOVE bands — no collisions)
  elh('div',{style:`position:absolute;left:${pad}px;right:${pad}px;top:${axisY}px;height:1px;background:var(--line-2)`},box);
  for(let d=0;d<=31;d+=7){
    const x=X(d);
    elh('div',{style:`position:absolute;left:${x-1}px;top:${axisY}px;width:1px;height:7px;background:var(--line-2)`},box);
    elh('div',{style:`position:absolute;left:${x-16}px;top:${axisY+11}px;width:32px;text-align:center;font-family:var(--mono);font-size:9px;color:var(--text-3)`},box).textContent=d+'d';
  }
  elh('div',{style:`position:absolute;left:${pad}px;top:${axisY+25}px;font-family:var(--mono);font-size:8.5px;color:var(--text-3);letter-spacing:.06em`},box).textContent='days until expiry →';
  // exit-window bands stacked above the axis; labels sit above the bands
  const arkExitDays=D.operators.arkade.unilateralExitDelaySec/86400;
  const secExitDays=(D.operators.second.exitDeltaBlocks*600)/86400;
  // Second band (thin, on top), Arkade band below it; one legend row above both
  elh('div',{class:'win win2',style:`left:${X(0)}px;width:${X(Math.min(secExitDays,days))-X(0)}px`,title:`Second exit window ≈ ${secExitDays.toFixed(1)} d before expiry`},box);
  elh('div',{class:'win',style:`left:${X(0)}px;width:${X(Math.min(arkExitDays,days))-X(0)}px`,title:`Arkade exit window ≈ ${arkExitDays.toFixed(0)} d before expiry`},box);
  elh('div',{class:'winlab',style:`left:${X(0)}px`},box).innerHTML=
    `<span style="color:var(--alert)">▨ arkade ≤${arkExitDays.toFixed(0)}d</span>&nbsp;·&nbsp;<span style="color:var(--chain)">▨ second ≤${secExitDays.toFixed(1)}d</span>`;
  // observed VTXOs as dots ON the axis, sized by √amount
  const obs=D.observedVtxos;
  const maxAmt=Math.max(...obs.map(v=>v.amount||1),1);
  for(const v of obs){
    const daysLeft=(v.expiresAt-now())/86400;
    if(daysLeft<0||daysLeft>days) continue;
    const x=X(daysLeft);
    const renew=v.state==='renew'||v.state==='expired';
    const sz=5+9*Math.sqrt((v.amount||0)/maxAmt);
    const d=elh('div',{class:'dot '+(renew?'renew':v.state==='settled'?'settled':'other'),style:`left:${x}px;top:${axisY}px;width:${sz.toFixed(1)}px;height:${sz.toFixed(1)}px`,title:`${mid(v.outpoint,14)} · ${sats(v.amount)} · ${until(v.expiresAt)}`},box);
    bindTip(d,`<div class="tt">observed vtxo · ${esc(v.state)}</div><div class="tx">${mid(v.outpoint)}</div><div style="margin-top:4px">${sats(v.amount)} · expires in ${until(v.expiresAt)}</div>`,e=>[e.clientX,e.clientY]);
  }
  // renew list — capped at 6 + "and N more"
  const renews=obs.filter(v=>v.state==='renew').sort((a,b)=>a.expiresAt-b.expiresAt);
  const rl=$('#renewList');
  if(!renews.length){ rl.innerHTML=`<li style="color:var(--text-3);border-top:0">No observed VTXOs in the exit window.</li>`; }
  else{
    rl.innerHTML = renews.slice(0,6).map(v=>`
      <li><span class="chip alert">renew</span><span class="mono" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto">${mid(v.outpoint,10)}</span><span class="amt">${satsShort(v.amount)}</span><span class="when">${until(v.expiresAt)}</span></li>`).join('')
      + (renews.length>6?`<div class="renew-more">… and ${renews.length-6} more in the exit window</div>`:'');
  }
  // deep stat
  const deep=CHAIN[D.featured.deepChainOutpoint];
  const depth=deep.length-deep.counts.commitment;
  $('#deepStat').innerHTML=`${depth} <small>off-chain txs to broadcast</small>`;
}

/* ---------- operators panel ---------- */
function buildOpPanel(){
  const box=$('#opPanel');
  const A=D.operators.arkade,S=D.operators.second;
  // Arkade VTXO lifetime = batch expiresAt − commitment endedAt, median across batches
  const lifeSpans=[];
  for(const c of Object.values(COMMIT)) for(const b of c.batches||[]) if(b.expiresAt&&c.endedAt) lifeSpans.push(b.expiresAt-c.endedAt);
  lifeSpans.sort((a,b)=>a-b);
  const arkLifeSec = lifeSpans.length? lifeSpans[Math.floor(lifeSpans.length/2)] : 30*86400;
  const arkLifeDays = arkLifeSec/86400;
  // Second: lifetime & exit delta are in BLOCKS — convert at the nominal 600 s/blk,
  // and note the observed mean rate across the sampled chain (blocks are newest-first)
  const bl=D.chain.blocks, meanB=bl.length>1?(bl[0].time-bl[bl.length-1].time)/(bl.length-1):600;
  const NOM=600;
  const secondLifeSec=S.vtxoLifetimeBlocks*NOM;
  const secondLifeDays=secondLifeSec/86400;
  const arkExit=A.unilateralExitDelaySec, secondExit=S.exitDeltaBlocks*NOM;
  const arkBoard=A.boardingExitDelaySec;
  const blkNote = Math.round(meanB)!==NOM ? ` · observed ≈${Math.round(meanB)} s/blk` : '';
  function lifeBar(totalSec,exitSec,label){
    const W=200;
    const exitW=Math.min(1,exitSec/totalSec)*W;
    return `<div class="lifebar" style="width:${W}px">
      <div class="seg-fill" style="left:0;width:${W-exitW}px"></div>
      <div class="seg-exit" style="left:${W-exitW}px;width:${exitW}px"></div>
    </div>
    <div class="lifebar-lab" style="width:${W}px"><span>0</span><span>${label}</span><span>${durExact(totalSec)}</span></div>`;
  }
  box.innerHTML=`
  <div class="op-block">
    <div class="op-name"><span class="nm">Arkade</span><span class="ver">${esc(A.version||'')}</span><span class="ep">${esc(A.endpoint.replace('https://',''))}</span></div>
    ${lifeBar(arkLifeSec,arkExit,'VTXO life ≈'+arkLifeDays.toFixed(1)+' d')}
    <div class="lifebar-lab" style="justify-content:flex-start;gap:14px;margin-top:2px">
      <span><i style="display:inline-block;width:8px;height:8px;background:rgba(143,184,255,.3);border-radius:2px"></i> safe window ${dur(0,arkLifeSec-arkExit).replace(' ','')}</span>
      <span><i style="display:inline-block;width:8px;height:8px;background:var(--alert);border-radius:2px"></i> exit window ${dur(0,arkExit).replace(' ','')}</span>
    </div>
    <div class="op-params" style="margin-top:10px">
      <span class="pk">cadence</span><span class="pv">session ${A.sessionDurationSec}s</span>
      <span class="pk">VTXO range</span><span class="pv">${sats(A.vtxoMinSat)} – ${satsShort(A.vtxoMaxSat)}</span>
      <span class="pk">board exit</span><span class="pv">${dur(0,arkBoard)}</span>
      <span class="pk">exit delay</span><span class="pv">${dur(0,arkExit)}</span>
      <span class="pk">status</span><span class="pv">${esc(A.status)}</span>
      <span class="pk">life basis</span><span class="pv">batch exp − ended · n=${lifeSpans.length}</span>
    </div>
    <div class="fee-expr" title="${esc(A.fees.offchainInputExpr||'')}">fee · ${esc(feeHuman(A.fees.offchainInputExpr))}</div>
  </div>
  <div class="op-block">
    <div class="op-name"><span class="nm">Second</span><span class="ver">grpc</span><span class="ep">${esc(S.endpoint.replace('https://',''))}</span></div>
    ${lifeBar(secondLifeSec,secondExit,'VTXO life ≈'+secondLifeDays.toFixed(1)+' d')}
    <div class="lifebar-lab" style="justify-content:flex-start;gap:14px;margin-top:2px">
      <span><i style="display:inline-block;width:8px;height:8px;background:rgba(143,184,255,.3);border-radius:2px"></i> safe window ≈${dur(0,secondLifeSec-secondExit).replace(' ','')}</span>
      <span><i style="display:inline-block;width:8px;height:8px;background:var(--alert);border-radius:2px"></i> exit window ≈${dur(0,secondExit).replace(' ','')}</span>
    </div>
    <div class="op-params" style="margin-top:10px">
      <span class="pk">round</span><span class="pv">every ${dur(0,S.roundIntervalSec)}</span>
      <span class="pk">VTXO life</span><span class="pv">${S.vtxoLifetimeBlocks} blk ≈ ${secondLifeDays.toFixed(1)} d${blkNote}</span>
      <span class="pk">exit delta</span><span class="pv">${S.exitDeltaBlocks} blk ≈ ${dur(0,secondExit)}${blkNote}</span>
      <span class="pk">max exit depth</span><span class="pv">${S.maxVtxoExitDepth}</span>
      <span class="pk">board conf</span><span class="pv">${S.boardConfirmations} blocks</span>
      <span class="pk">next round</span><span class="pv" id="nrCd">—</span>
    </div>
    <div class="next-round">◈ round ${S.lastRoundEvent?S.lastRoundEvent.roundSeq:'—'} · ${esc(S.lastRoundEvent?S.lastRoundEvent.kind:'—')} · funding <span class="mono">${mid(S.lastRoundEvent?S.lastRoundEvent.fundingTxid:'',12)}</span></div>
  </div>`;
  clockEls.push(()=>{ const elx=$('#nrCd'); if(elx){const l=D.operators.second.nextRoundAt-now(); elx.textContent=l>0?inDur(l):'due';}});
}
function feeHuman(expr){
  if(!expr) return 'no off-chain input fee';
  const m=expr.match(/expiry - now\(\) > ([\d.]+).*amount \* ([\d.]+) : 0\.0/);
  if(m){
    const pct=parseFloat(m[2])*100;
    const pctStr=pct>=1?pct.toFixed(pct>=10?0:1).replace(/\.0$/,'')+'%':pct.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')+'%';
    return `${pctStr} of input when VTXO has > ${dur(0,+m[1])} left, else free`;
  }
  return expr;
}
